name: Publicar versión
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'preview.png', 'docs/**']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

# Acciones fijadas a un commit exacto: un tag movido por un tercero no puede robar la clave de firma.
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Comprobar clave de firma
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Falta el secreto TAURI_SIGNING_PRIVATE_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }   # con un commit fijo hay que nombrar la versión de Rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run tauri icon icon.png

      # Cada ejecución es una versión nueva (0.1.N) para que las apps instaladas vean la actualización.
      - name: Poner versión
        shell: bash
        run: |
          V="0.1.${{ github.run_number }}"
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$V';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          sed -i "0,/^version = .*/s//version = \"$V\"/" src-tauri/Cargo.toml
          echo "VERSION=$V" >> $GITHUB_ENV

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: Lite Music ${{ env.VERSION }}
          releaseBody: Instalador de Windows (.exe). Las apps ya instaladas se actualizan solas.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
