<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Configuración</title>
<style>
  :root { --bg:#0e0e13; --panel:#15151c; --line:#ffffff14; --text:#f2f2f6; --dim:#9a9aa8; --accent:#ff2d55; --hover:#1d1d27; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; }
  nav { width: 200px; padding: 22px 12px; border-right: 1px solid var(--line); flex-shrink: 0; }
  nav h1 { font-size: 15px; margin: 0 10px 18px; letter-spacing: .3px; }
  nav h1 span { color: var(--accent); }
  nav button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 2px; border: 0; border-radius: 10px;
               background: transparent; color: var(--dim); font: inherit; text-align: left; cursor: pointer; }
  nav button:hover { background: var(--hover); color: var(--text); }
  nav button.on { background: var(--hover); color: var(--text); }
  nav button.on i { color: var(--accent); }
  nav i { font-style: normal; width: 20px; text-align: center; }
  main { flex: 1; overflow-y: auto; padding: 26px 34px 40px; }
  h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.2px; }
  .sub { color: var(--dim); margin: 0 0 20px; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.off { opacity: .45; pointer-events: none; }
  .lbl b { display: block; font-weight: 600; }
  .lbl small { color: var(--dim); }
  /* interruptor */
  .sw { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .sw span { position: absolute; inset: 0; background: #2c2c38; border-radius: 99px; transition: background .15s; }
  .sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw input:checked + span { background: var(--accent); } .sw input:checked + span::after { transform: translateX(18px); }
  /* deslizador */
  .rng { display: flex; align-items: center; gap: 12px; width: 260px; }
  .rng input { flex: 1; accent-color: var(--accent); }
  .rng output { width: 48px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  /* números */
  .num { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  .num input { width: 72px; padding: 7px 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; text-align: right; }
  .num input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  /* botones */
  .btn { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--hover); color: var(--text); font: inherit; cursor: pointer; }
  .btn:hover { border-color: #ffffff40; } .btn.pri { background: var(--accent); border-color: var(--accent); } .btn.danger { color: #ff7b8f; }
  .btns { display: flex; gap: 8px; }
  /* aspecto */
  .skins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 16px 18px; }
  .skin { padding: 12px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; cursor: pointer; text-align: center; }
  .skin:hover { border-color: #ffffff40; } .skin.on { border-color: var(--accent); background: #ff2d5518; }
  .skin em { display: block; font-style: normal; font-size: 24px; line-height: 1.3; } .skin span { font-size: 12px; color: var(--dim); }
  .grp-title { padding: 12px 18px 0; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .8px; }
  #toast { position: fixed; right: 22px; bottom: 18px; padding: 8px 14px; border-radius: 10px; background: #22222d; border: 1px solid var(--line); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
  @media (max-width: 720px) { .skins { grid-template-columns: repeat(3, 1fr); } .rng { width: 180px; } }
</style>
</head>
<body>
<nav>
  <h1>Lite <span>Music</span></h1>
  <div id="tabs"></div>
</nav>
<main id="main"></main>
<div id="toast">Guardado</div>
<script>
const inv = (c, a) => window.__TAURI_INTERNALS__.invoke(c, a);
let S = {}, META = {};

const SKINS = [
  ['dog', '🐶', 'Perro'], ['cat', '🐱', 'Gato'], ['cover', '🖼️', 'Carátula'], ['none', '▭', 'Sin imagen'],
  ['trabajando', '💼', 'Trabajando'], ['programando', '💻', 'Programando'], ['tradeando', '📈', 'Tradeando'],
  ['descansando', '😴', 'Descansando'], ['estudiando', '📚', 'Estudiando'], ['festejando', '🎉', 'Festejando'],
];
// Cada pestaña: grupos de ajustes. type: toggle | range | num | skins | button
const TABS = [
  { id: 'float', icon: '🪟', name: 'Flotante', sub: 'Cómo se ve y dónde aparece el reproductor flotante.', groups: [
    [{ type: 'skins', key: 'skin' }],
    [
      { type: 'range', key: 'scale', label: 'Tamaño', desc: 'También con la rueda del ratón sobre el flotante.', min: 0.4, max: 1.2, step: 0.05, fmt: v => Math.round(v * 100) + '%' },
      { type: 'range', key: 'float_opacity', label: 'Opacidad', desc: 'Más bajo = más transparente.', min: 0.3, max: 1, step: 0.05, fmt: v => Math.round(v * 100) + '%' },
      { type: 'toggle', key: 'float_on_top', label: 'Siempre encima', desc: 'Se mantiene por delante de otras ventanas.' },
      { type: 'toggle', key: 'float_at_start', label: 'Mostrar al iniciar la app', desc: 'Si lo apagas, se abre oculto y lo muestras desde la bandeja.' },
      { type: 'toggle', key: 'autohide', label: 'Ocultar en juegos y pantalla completa', desc: 'Vuelve solo al terminar.' },
      { type: 'button', label: 'Posición', desc: 'Lo recuerda donde lo dejes.', buttons: [['Centrar en pantalla', 'reset_pos']] },
    ] ] },
  { id: 'anim', icon: '✨', name: 'Animaciones', sub: 'Reacciones y movimientos de los personajes.', groups: [
    [
      { type: 'toggle', key: 'blink', label: 'Parpadeo', desc: 'El perro y el gato parpadean de vez en cuando.' },
      { type: 'toggle', key: 'reactions', label: 'Reaccionar a tus acciones', desc: 'Pausar, reanudar, cambiar de canción, siguiente/anterior y volumen.' },
    ],
    [
      { type: 'toggle', key: 'wave', label: 'Saludar con la patita', desc: 'De vez en cuando, mientras suena la música.' },
      { type: 'num', key: 'wave_min_s', label: 'Saludar cada, como mínimo', unit: 's', min: 5, max: 600, dep: 'wave' },
      { type: 'num', key: 'wave_max_s', label: 'Saludar cada, como máximo', unit: 's', min: 5, max: 900, dep: 'wave' },
    ],
    [
      { type: 'toggle', key: 'yawn', label: 'Bostezar por inactividad', desc: 'Si no tocas el flotante durante un rato.' },
      { type: 'num', key: 'yawn_idle_s', label: 'Bostezar tras', unit: 's', min: 20, max: 900, dep: 'yawn' },
    ],
    [
      { type: 'num', key: 'mood_min_s', label: 'Acción del mood cada, como mínimo', unit: 's', min: 5, max: 300 },
      { type: 'num', key: 'mood_max_s', label: 'Acción del mood cada, como máximo', unit: 's', min: 5, max: 600 },
    ] ] },
  { id: 'pomo', icon: '🍅', name: 'Pomodoro', sub: 'Alterna estudio y descanso; pausa y reanuda la música sola.', groups: [
    [
      { type: 'num', key: 'pomo_focus_min', label: 'Estudio', unit: 'min', min: 1, max: 180 },
      { type: 'num', key: 'pomo_rest_min', label: 'Descanso', unit: 'min', min: 1, max: 60 },
      { type: 'button', label: 'Temporizador', desc: 'Cambia el flotante a "Estudiando" y a "Descansando" según la fase.', buttons: [['Iniciar', 'pomo_start', 'pri'], ['Detener', 'pomo_stop']] },
    ] ] },
  { id: 'sys', icon: '⚙️', name: 'Sistema', sub: 'Inicio, ventana y actualizaciones.', groups: [
    [
      { type: 'toggle', key: 'autostart', label: 'Iniciar con Windows', desc: 'Arranca minimizada en la bandeja.' },
      { type: 'choice', key: 'source', label: 'Servicio de música', desc: 'También desde la bandeja. Spotify se abre en la misma ventana; inicia sesión con tu cuenta de Spotify o con "Continuar con Google" (la misma cuenta de YouTube).', options: [['ytm', 'YouTube Music'], ['spotify', 'Spotify']] },
      { type: 'toggle', key: 'close_to_tray', label: 'Cerrar a la bandeja', desc: 'Al cerrar la ventana la música sigue sonando. Si lo apagas, cerrar sale de la app.' },
    ],
    [
      { type: 'toggle', key: 'idle_webview', label: 'Ahorro de memoria con la ventana oculta', desc: 'Pide a WebView2 que libere memoria mientras la ventana está en la bandeja.' },
      { type: 'toggle', key: 'idle_hide_ui', label: 'No dibujar la interfaz de YouTube al ocultarla', desc: 'La música sigue sonando. Apágalo si algo no responde al volver.' },
      { type: 'toggle', key: 'suspend_idle', label: 'Congelar YouTube Music cuando no suena nada', desc: 'Con la ventana oculta y la música en pausa, la página se suspende por completo (casi 0 % de CPU). Se reactiva sola al mostrar la ventana o usar los controles del flotante o de la bandeja. Las teclas multimedia no la despiertan.' },
      { type: 'num', key: 'suspend_after_s', label: 'Congelar tras', unit: 's', min: 30, max: 1800, dep: 'suspend_idle' },
      { type: 'toggle', key: 'destroy_float', label: 'Liberar el flotante cuando está oculto', desc: 'Se cierra su proceso (unos 25 MB) y reaparece en un instante al mostrarlo.' },
    ],
    [
      { type: 'toggle', key: 'auto_update', label: 'Buscar actualizaciones al abrir', desc: 'Se instalan solas.' },
      { type: 'button', label: 'Actualizaciones', desc: '', id: 'ver', buttons: [['Buscar ahora', 'check_update']] },
    ] ] },
  { id: 'about', icon: '↺', name: 'Restablecer', sub: 'Vuelve todo a como venía de fábrica.', groups: [
    [ { type: 'button', label: 'Restablecer todos los ajustes', desc: 'No cierra tus sesiones de YouTube Music ni de Spotify.', buttons: [['Restablecer', 'reset_settings', 'danger']] } ] ] },
];

const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
let toastT;
const toast = (m = 'Guardado') => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1200); };
async function set(key, value) { S[key] = value; await inv('set_setting', { key, value }); toast(); }
async function act(a) {
  if (a === 'reset_settings' && !confirm('¿Restablecer todos los ajustes?')) return;
  await inv('settings_action', { action: a });
  toast(a === 'check_update' ? 'Buscando… (mira el icono de la bandeja)' : a === 'pomo_start' ? 'Pomodoro iniciado' : a === 'pomo_stop' ? 'Pomodoro detenido' : 'Listo');
  if (a === 'reset_settings') await load();
}

function row(it) {
  if (it.type === 'skins') {
    const w = $('<div class="skins"></div>');
    SKINS.forEach(([id, ic, nm]) => {
      const b = $(`<button class="skin${S.skin === id ? ' on' : ''}"><em>${ic}</em><span>${nm}</span></button>`);
      b.onclick = () => { set('skin', id); w.querySelectorAll('.skin').forEach(x => x.classList.remove('on')); b.classList.add('on'); };
      w.append(b);
    });
    return w;
  }
  const r = $(`<div class="row"><div class="lbl"><b>${it.label}</b>${it.desc ? `<small>${it.desc}</small>` : ''}</div></div>`);
  if (it.dep) r.dataset.dep = it.dep;
  if (it.type === 'toggle') {
    const c = $(`<label class="sw"><input type="checkbox"><span></span></label>`), i = c.querySelector('input');
    i.checked = !!S[it.key];
    i.onchange = () => { set(it.key, i.checked); refreshDeps(); };
    r.append(c);
  } else if (it.type === 'choice') {
    const c = $('<div class="btns"></div>');
    it.options.forEach(([v, t]) => {
      const b = $(`<button class="btn ${S[it.key] === v ? 'pri' : ''}">${t}</button>`);
      b.onclick = () => { set(it.key, v); c.querySelectorAll('.btn').forEach(x => x.classList.remove('pri')); b.classList.add('pri'); };
      c.append(b);
    });
    r.append(c);
  } else if (it.type === 'range') {
    const c = $(`<div class="rng"><input type="range" min="${it.min}" max="${it.max}" step="${it.step}"><output></output></div>`), i = c.querySelector('input'), o = c.querySelector('output');
    i.value = S[it.key]; o.textContent = it.fmt(+i.value);
    i.oninput = () => { o.textContent = it.fmt(+i.value); };
    i.onchange = () => set(it.key, +i.value);
    r.append(c);
  } else if (it.type === 'num') {
    const c = $(`<div class="num"><input type="number" min="${it.min}" max="${it.max}"><span>${it.unit}</span></div>`), i = c.querySelector('input');
    i.value = S[it.key];
    i.onchange = async () => { const v = Math.min(it.max, Math.max(it.min, +i.value || it.min)); i.value = v; await set(it.key, v); await load(true); };
    r.append(c);
  } else if (it.type === 'button') {
    const c = $('<div class="btns"></div>');
    it.buttons.forEach(([t, a, cls]) => { const b = $(`<button class="btn ${cls || ''}">${t}</button>`); b.onclick = () => act(a); c.append(b); });
    r.append(c);
    if (it.id === 'ver') r.querySelector('small').textContent = 'Versión instalada: ' + (META.version || '');
  }
  return r;
}
function refreshDeps() {
  document.querySelectorAll('[data-dep]').forEach(r => r.classList.toggle('off', !S[r.dataset.dep]));
}
let cur = 'float';
function render() {
  const t = TABS.find(x => x.id === cur), m = document.getElementById('main');
  const y = m.scrollTop; m.innerHTML = '';
  m.append($(`<h2>${t.name}</h2>`), $(`<p class="sub">${t.sub}</p>`));
  t.groups.forEach(g => { const el = $('<div class="group"></div>'); g.forEach(it => el.append(row(it))); m.append(el); });
  refreshDeps(); m.scrollTop = y;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.id === cur));
}
function buildTabs() {
  const n = document.getElementById('tabs'); n.innerHTML = '';
  TABS.forEach(t => { const b = $(`<button data-id="${t.id}"><i>${t.icon}</i>${t.name}</button>`); b.onclick = () => { cur = t.id; render(); }; n.append(b); });
}
async function load(keep) {
  const v = await inv('get_settings');
  S = { ...v.settings, autostart: v.autostart }; META = { version: v.version };
  if (!keep) buildTabs();
  render();
}
load();
</script>
</body>
</html>
