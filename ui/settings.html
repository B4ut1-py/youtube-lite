<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Configuración</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  :root { --panel: var(--surface); --segbg: var(--hover); --segon: var(--surface2); color-scheme: dark; } html.light { color-scheme: light; --segon: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13.5px/1.45 var(--font); }
  body { display: flex; }
  /* menú lateral */
  nav { width: 208px; padding: 18px 10px; border-right: 1px solid var(--line); flex-shrink: 0; display: flex; flex-direction: column; }
  nav h1 { display: flex; align-items: center; gap: 9px; margin: 0 10px 18px; font-size: 14px; font-weight: 650; }
  nav h1 img { width: 20px; height: 20px; }
  nav button { display: flex; width: 100%; align-items: center; gap: 11px; padding: 8px 10px; margin-bottom: 2px; border: 0; border-radius: 8px;
               background: transparent; color: var(--dim); font: inherit; text-align: left; cursor: pointer; }
  nav button:hover { background: var(--hover); color: var(--text); }
  nav button.on { background: var(--hover); color: var(--text); font-weight: 600; }
  nav svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  nav button.on svg { stroke: var(--accent); }
  nav .ver { margin-top: auto; padding: 0 10px; color: var(--dim); font-size: 11.5px; }
  /* contenido */
  main { flex: 1; overflow-y: auto; padding: 26px 32px 40px; }
  main > div { max-width: 640px; }
  h2 { margin: 0 0 18px; font-size: 19px; font-weight: 650; letter-spacing: -.2px; }
  h3 { margin: 22px 2px 8px; font-size: 12px; font-weight: 600; color: var(--dim); }
  h2 + h3 { margin-top: 0; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 56px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.off { opacity: .45; pointer-events: none; }
  .lbl { min-width: 0; } .lbl b { display: block; font-weight: 500; }
  .lbl small { display: block; color: var(--dim); font-size: 12px; }
  /* interruptor */
  .sw { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .sw span { position: absolute; inset: 0; background: var(--track); border-radius: 99px; transition: background .15s; }
  .sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #0004; transition: transform .15s; }
  .sw input:checked + span { background: var(--accent); } .sw input:checked + span::after { transform: translateX(18px); }
  .sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* selector segmentado */
  .seg { display: flex; flex-shrink: 0; gap: 2px; padding: 2px; border-radius: 8px; background: var(--segbg); }
  .seg button { padding: 5px 12px; border: 0; border-radius: 6px; background: transparent; color: var(--dim); font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--segon); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px #0003; }
  .pick { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  /* deslizador */
  .rng { display: flex; align-items: center; gap: 12px; width: 230px; flex-shrink: 0; }
  .rng input { flex: 1; accent-color: var(--accent); }
  .rng output { width: 40px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  /* números */
  .num { display: flex; align-items: center; gap: 6px; color: var(--dim); flex-shrink: 0; }
  .num input { width: 64px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; text-align: right; }
  .num input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  /* botones */
  .btns { display: flex; gap: 6px; flex-shrink: 0; }
  .btn { padding: 6px 13px; border-radius: 7px; border: 1px solid var(--line); background: var(--hover); color: var(--text); font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--dim); } .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; } .btn.danger { color: #ff7b8f; }
  html.light .btn.danger { color: #c4143a; }
  /* aspecto del reproductor */
  .skins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 12px; }
  .skin { padding: 10px 4px 8px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--text); font: inherit; cursor: pointer; text-align: center; }
  .skin:hover { background: var(--hover); } .skin.on { border-color: var(--accent); background: var(--accent-soft); }
  .skin em { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 6px; border-radius: 10px; background: var(--sw, var(--surface2));
            font-style: normal; font-size: 22px; box-shadow: inset 0 0 0 1px #ffffff1a; } .skin span { font-size: 11.5px; color: var(--dim); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 12px 16px; font-size: 12.5px; }
  .keys span { color: var(--dim); }
  kbd { font: inherit; font-size: 11.5px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--hover); white-space: nowrap; }
  #toast { position: fixed; right: 20px; bottom: 16px; padding: 7px 13px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--line); font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
  .clr { width: 30px; height: 26px; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: none; cursor: pointer; }
  .clr::-webkit-color-swatch-wrapper { padding: 0; } .clr::-webkit-color-swatch { border: 0; border-radius: 5px; }
  /* Cristal: solo apariencia (colores, radios y sombras) */
  html.glass { --panel: var(--tint); --segbg: var(--tint); --segon: rgba(255, 255, 255, .24); }
  html.glass.light { --segon: rgba(255, 255, 255, .85); }
  html.glass nav { background: var(--tint); border-right-color: var(--rim2); }
  html.glass.light nav button.on svg { stroke: #c8164a; }
  html.glass nav button { border-radius: 999px; }
  html.glass nav button.on { box-shadow: inset 0 1px 0 var(--rim), inset 0 -1px 0 var(--rim2); }
  html.glass .group { border-color: transparent; border-radius: 18px; box-shadow: inset 0 1px 0 var(--rim), inset 0 -1px 0 var(--rim2), 0 8px 22px rgba(0, 0, 0, .18); }
  html.glass .row { border-bottom-color: var(--rim2); }
  html.glass .seg, html.glass .seg button { border-radius: 999px; }
  html.glass .seg button.on { box-shadow: inset 0 1px 0 var(--rim), inset 0 -1px 0 var(--rim2), 0 2px 6px rgba(0, 0, 0, .18); }
  html.glass .btn { border-color: transparent; border-radius: 999px; background: var(--tint); box-shadow: inset 0 1px 0 var(--rim), inset 0 -1px 0 var(--rim2); }
  html.glass .btn:hover { background: var(--hover); }
  html.glass .btn.pri { background: var(--accent); color: #fff; }
  html.glass .btn.danger { color: #ff9aaa; } html.glass.light .btn.danger { color: #c4143a; }
  html.glass .num input { background: var(--tint); border-color: transparent; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .12), inset 0 -1px 0 var(--rim2); }
  html.glass .skin.on { background: var(--accent-soft); border-color: var(--accent); }
  html.glass kbd { background: var(--tint); border-color: var(--rim2); }
  html.glass .sw span { box-shadow: inset 0 1px 1px rgba(0, 0, 0, .12); }
  html.glass #toast { background: rgba(30, 30, 40, .72); color: #fff; border-color: transparent; box-shadow: inset 0 1px 0 var(--rim), 0 6px 18px rgba(0, 0, 0, .3); }
  html.glass.light #toast { background: rgba(255, 255, 255, .85); color: #14141a; }
  @media (max-width: 760px) { .skins { grid-template-columns: repeat(4, 1fr); } .rng { width: 170px; } main { padding: 22px 20px 32px; } }
</style>
</head>
<body>
<nav>
  <h1><img src="logo.png" alt="">Configuración</h1>
  <div id="tabs"></div>
  <div class="ver" id="ver"></div>
</nav>
<main id="main"></main>
<div id="toast">Guardado</div>
<script>
const inv = (c, a) => window.__TAURI_INTERNALS__.invoke(c, a);
let S = {}, META = {};

const SKINS = [
  ['dog', '🐶', 'Perro', '#73b8ff,#3d6fd6'], ['cat', '🐱', 'Gato', '#ffa58f,#e8607e'], ['cover', '🖼️', 'Carátula'], ['none', '▭', 'Solo controles'],
  ['trabajando', '💼', 'Trabajando', '#a9cdfb,#7199e0'], ['programando', '💻', 'Programando', '#2b3150,#171a2b'], ['tradeando', '📈', 'Tradeando', '#2f3550,#1a1d2e'],
  ['descansando', '😴', 'Descansando', '#c3b3ff,#8f78e8'], ['estudiando', '📚', 'Estudiando', '#4a3a68,#2b2240'], ['festejando', '🎉', 'Festejando', '#ff8fbf,#7d5cff'],
];
// íconos de línea (trazos de 24x24)
const ICONS = {
  look: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M12 3.5a8.5 8.5 0 0 1 0 17"/>',
  player: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z"/>',
  anim: '<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18.5 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
  timer: '<circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/>',
  app: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/>',
  perf: '<path d="M4 18a8 8 0 1 1 16 0M12 18l4-5"/>',
  info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',
};
// Pestañas → secciones (título opcional + ajustes). type: toggle | range | num | choice | skins | button | keys
// when(S): el ajuste solo se puede tocar si se cumple (si no, se ve atenuado)
const glassOn = (s) => s.glass !== 'off', artOn = (s) => s.glass === 'art';
const TABS = [
  { id: 'look', name: 'Apariencia', sections: [
    ['', [
      { type: 'choice', key: 'theme', label: 'Tema', options: [['auto', 'Sistema'], ['dark', 'Oscuro'], ['light', 'Claro']] },
      { type: 'choice', key: 'glass', label: 'Estilo', desc: 'Cristal y Transparente dan efecto de vidrio a toda la app.', options: [['off', 'Normal'], ['art', 'Cristal'], ['screen', 'Transparente']] },
      { type: 'choice', key: 'glass_bg', label: 'Fondo', desc: 'El fondo fijo de la app con efecto de vidrio.', options: [['dark', 'Oscuro'], ['light', 'Claro'], ['custom', 'Color']], color: 'glass_color', when: glassOn },
    ]] ] },
  { id: 'player', name: 'Reproductor', sections: [
    ['Formato', [
      { type: 'choice', key: 'format', label: 'Formato', desc: 'La isla es un pliegue arriba en el centro de la pantalla; se abre al pasar el mouse.', options: [['normal', 'Normal'], ['compact', 'Compacto'], ['mini', 'Mínimo'], ['island', 'Isla']] },
      { type: 'toggle', key: 'float_app_bg', label: 'Usar el fondo de la app', desc: 'El reproductor y la isla toman el fondo de la app en lugar de la carátula (con Cristal).', when: artOn },
      { type: 'range', key: 'scale', label: 'Tamaño', desc: 'También con Ctrl + rueda del mouse sobre el reproductor.', min: 0.7, max: 1.6, step: 0.05, fmt: v => Math.round(v * 100) + '%' },
      { type: 'range', key: 'float_opacity', label: 'Opacidad', min: 0.3, max: 1, step: 0.05, fmt: v => Math.round(v * 100) + '%' },
    ]],
    ['Aspecto', [{ type: 'skins', key: 'skin' }]],
    ['Comportamiento', [
      { type: 'toggle', key: 'float_on_top', label: 'Siempre encima', desc: 'Por delante de las demás ventanas.' },
      { type: 'toggle', key: 'float_at_start', label: 'Mostrar al iniciar la app' },
      { type: 'toggle', key: 'autohide', label: 'Ocultar en juegos y pantalla completa', desc: 'Vuelve solo al terminar.' },
      { type: 'button', label: 'Posición', desc: 'Recuerda donde lo dejes.', buttons: [['Centrar', 'reset_pos']] },
    ]] ] },
  { id: 'anim', name: 'Animaciones', sections: [
    ['', [
      { type: 'toggle', key: 'blink', label: 'Parpadeo', desc: 'El perro y el gato parpadean de vez en cuando.' },
      { type: 'toggle', key: 'reactions', label: 'Reaccionar a tus acciones', desc: 'Pausa, cambio de canción y volumen.' },
      { type: 'toggle', key: 'wave', label: 'Saludar con la patita', desc: 'De vez en cuando mientras suena la música.' },
      { type: 'num', key: 'wave_min_s', label: 'Saludar cada, como mínimo', unit: 's', min: 5, max: 600, dep: 'wave' },
      { type: 'num', key: 'wave_max_s', label: 'Saludar cada, como máximo', unit: 's', min: 5, max: 900, dep: 'wave' },
      { type: 'toggle', key: 'yawn', label: 'Bostezar por inactividad' },
      { type: 'num', key: 'yawn_idle_s', label: 'Bostezar tras', unit: 's', min: 20, max: 900, dep: 'yawn' },
    ]],
    ['Personajes con actividad', [
      { type: 'num', key: 'mood_min_s', label: 'Nueva acción cada, como mínimo', unit: 's', min: 5, max: 300 },
      { type: 'num', key: 'mood_max_s', label: 'Nueva acción cada, como máximo', unit: 's', min: 5, max: 600 },
    ]] ] },
  { id: 'timer', name: 'Temporizadores', sections: [
    ['Pomodoro', [
      { type: 'num', key: 'pomo_focus_min', label: 'Estudio', unit: 'min', min: 1, max: 180 },
      { type: 'num', key: 'pomo_rest_min', label: 'Descanso', unit: 'min', min: 1, max: 60 },
      { type: 'button', label: 'Pomodoro', desc: 'Pausa y reanuda la música en cada fase.', buttons: [['Iniciar', 'pomo_start', 'pri'], ['Detener', 'pomo_stop']] },
    ]],
    ['Dormir', [
      { type: 'button', label: 'Pausar la música en', buttons: [['15 min', 'sleep15'], ['30 min', 'sleep30'], ['1 hora', 'sleep60'], ['Cancelar', 'sleep0']] },
    ]] ] },
  { id: 'app', name: 'General', sections: [
    ['', [
      { type: 'choice', key: 'source', label: 'Servicio de música', options: [['ytm', 'YouTube Music'], ['spotify', 'Spotify']] },
      { type: 'toggle', key: 'autostart', label: 'Iniciar con Windows', desc: 'Arranca en la bandeja.' },
      { type: 'toggle', key: 'close_to_tray', label: 'Cerrar a la bandeja', desc: 'La música sigue sonando al cerrar la ventana.' },
      { type: 'toggle', key: 'notify_song', label: 'Avisar al cambiar de canción', desc: 'Notificación de Windows, solo si no estás mirando la ventana.' },
    ]],
    ['Atajos de teclado', [{ type: 'keys' }]] ] },
  { id: 'perf', name: 'Rendimiento', sections: [
    ['Con la ventana oculta', [
      { type: 'toggle', key: 'idle_webview', label: 'Ahorrar memoria', desc: 'Libera memoria mientras la app está en la bandeja.' },
      { type: 'toggle', key: 'idle_hide_ui', label: 'No dibujar la página', desc: 'La música sigue. Apagalo si algo no responde al volver.' },
      { type: 'toggle', key: 'destroy_float', label: 'Liberar el reproductor oculto', desc: 'Ahorra unos 25 MB y reaparece al instante.' },
    ]] ] },
  { id: 'info', name: 'Acerca de', sections: [
    ['Actualizaciones', [
      { type: 'toggle', key: 'auto_update', label: 'Avisar si hay una versión nueva', desc: 'Busca cada hora y avisa arriba en la ventana. Nunca se instala sola.' },
      { type: 'button', label: 'Versión instalada', id: 'ver', buttons: [['Buscar ahora', 'check_update']] },
    ]],
    ['Lite Music', [
      { type: 'button', label: 'Código y autor', desc: 'Hecho por Bautista Rubio.', buttons: [['Repositorio', 'link:repo'], ['GitHub', 'link:github'], ['LinkedIn', 'link:linkedin']] },
      { type: 'button', label: 'Restablecer ajustes', desc: 'No cierra tus sesiones de YouTube Music ni de Spotify.', buttons: [['Restablecer', 'reset_settings', 'danger']] },
    ]] ] },
];
const KEYS = [['Ctrl + Alt + Mayús + Espacio', 'Reproducir / pausar'], ['Ctrl + Alt + Mayús + → / ←', 'Siguiente / anterior'], ['Ctrl + Alt + Mayús + ↑ / ↓', 'Volumen'],
  ['Ctrl + Mayús + Espacio', 'Buscar'], ['Clic del medio en la bandeja', 'Reproducir / pausar']];

const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
let toastT;
const toast = (m = 'Guardado') => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1400); };
async function set(key, value) {
  S[key] = value; if (key === 'theme') applyTheme(value);
  await inv('set_setting', { key, value });
  if (key.startsWith('glass')) try { applyGlass((await inv('get_settings')).glass_spec); } catch (_) {}
  refreshDeps(); toast();
}
async function act(a) {
  if (a.startsWith('link:')) return inv('open_link', { which: a.slice(5) });
  if (a === 'reset_settings' && !confirm('¿Restablecer todos los ajustes?')) return;
  await inv('settings_action', { action: a });
  toast(a === 'check_update' ? 'Buscando… si hay una versión nueva, aparece arriba en la ventana' : a === 'pomo_start' ? 'Pomodoro iniciado' : a === 'pomo_stop' ? 'Pomodoro detenido' : a === 'sleep0' ? 'Temporizador cancelado' : a.startsWith('sleep') ? 'La música se pausará en ' + a.slice(5) + ' min' : 'Listo');
  if (a === 'reset_settings') await load();
}

function row(it) {
  if (it.type === 'skins') {
    const w = $('<div class="skins"></div>');
    SKINS.forEach(([id, ic, nm, g]) => {
      const b = $(`<button class="skin${S.skin === id ? ' on' : ''}"><em>${ic}</em><span>${nm}</span></button>`);
      if (g) b.firstChild.style.setProperty('--sw', `linear-gradient(160deg,${g})`);   // por JS: la CSP bloquea style="..." en el HTML
      b.onclick = () => { set('skin', id); w.querySelectorAll('.skin').forEach(x => x.classList.remove('on')); b.classList.add('on'); };
      w.append(b);
    });
    return w;
  }
  if (it.type === 'keys') {
    const w = $('<div class="keys"></div>');
    KEYS.forEach(([k, t]) => w.append($(`<kbd>${k}</kbd>`), $(`<span>${t}</span>`)));
    return w;
  }
  const r = $(`<div class="row"><div class="lbl"><b>${it.label}</b>${it.desc ? `<small>${it.desc}</small>` : ''}</div></div>`);
  if (it.dep || it.when) r._when = it.when || ((s) => !!s[it.dep]);
  if (it.type === 'toggle') {
    const c = $(`<label class="sw"><input type="checkbox" aria-label="${it.label}"><span></span></label>`), i = c.querySelector('input');
    i.checked = !!S[it.key];
    i.onchange = () => set(it.key, i.checked);
    r.append(c);
  } else if (it.type === 'choice') {
    const p = $('<div class="pick"></div>'), c = $('<div class="seg"></div>');
    const mark = () => c.querySelectorAll('button').forEach((x, k) => x.classList.toggle('on', S[it.key] === it.options[k][0]));
    it.options.forEach(([v, t]) => { const b = $(`<button>${t}</button>`); b.onclick = async () => { await set(it.key, v); mark(); }; c.append(b); });
    mark(); p.append(c);
    if (it.color) {   // cuadrito de color: elegirlo pasa a la opción "custom"
      const i = $(`<input type="color" class="clr" aria-label="Color del fondo">`); i.value = S[it.color];
      i.onchange = async () => { await set(it.color, i.value); await set(it.key, 'custom'); mark(); };
      p.append(i);
    }
    r.append(p);
  } else if (it.type === 'range') {
    const c = $(`<div class="rng"><input type="range" min="${it.min}" max="${it.max}" step="${it.step}" aria-label="${it.label}"><output></output></div>`), i = c.querySelector('input'), o = c.querySelector('output');
    i.value = S[it.key]; o.textContent = it.fmt(+i.value);
    i.oninput = () => { o.textContent = it.fmt(+i.value); };
    i.onchange = () => set(it.key, +i.value);
    r.append(c);
  } else if (it.type === 'num') {
    const c = $(`<div class="num"><input type="number" min="${it.min}" max="${it.max}" aria-label="${it.label}"><span>${it.unit}</span></div>`), i = c.querySelector('input');
    i.value = S[it.key];
    i.onchange = async () => { const v = Math.min(it.max, Math.max(it.min, +i.value || it.min)); i.value = v; await set(it.key, v); await load(true); };
    r.append(c);
  } else if (it.type === 'button') {
    const c = $('<div class="btns"></div>');
    it.buttons.forEach(([t, a, cls]) => { const b = $(`<button class="btn ${cls || ''}">${t}</button>`); b.onclick = () => act(a); c.append(b); });
    r.append(c);
    if (it.id === 'ver') r.querySelector('b').textContent = 'Versión instalada: ' + (META.version || '');
  }
  return r;
}
function refreshDeps() {
  document.querySelectorAll('.row').forEach(r => { if (r._when) r.classList.toggle('off', !r._when(S)); });
}
let cur = 'look';
function render() {
  const t = TABS.find(x => x.id === cur), m = document.getElementById('main');
  const y = m.scrollTop; m.innerHTML = '';
  const box = $('<div></div>'); box.append($(`<h2>${t.name}</h2>`));
  t.sections.forEach(([title, items]) => {
    if (title) box.append($(`<h3>${title}</h3>`));
    const el = $('<div class="group"></div>'); items.forEach(it => el.append(row(it))); box.append(el);
  });
  m.append(box); refreshDeps(); m.scrollTop = y;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.id === cur));
}
function buildTabs() {
  const n = document.getElementById('tabs'); n.innerHTML = '';
  TABS.forEach(t => {
    const b = $(`<button data-id="${t.id}"><svg viewBox="0 0 24 24">${ICONS[t.id]}</svg>${t.name}</button>`);
    b.onclick = () => { cur = t.id; render(); document.getElementById('main').scrollTop = 0; }; n.append(b);
  });
}
async function load(keep) {
  const v = await inv('get_settings');
  S = { ...v.settings, autostart: v.autostart }; META = { version: v.version };
  document.getElementById('ver').textContent = 'Versión ' + (v.version || '');
  applyTheme(S.theme); applyGlass(v.glass_spec);
  if (!keep) buildTabs();
  render();
}
load();
</script>
</body>
