<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Lite Music</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#2b2160 0%,#14141f 60%);color:#eceaf7;font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;user-select:none}
.logo{width:92px;height:92px;border-radius:22px;box-shadow:0 10px 40px #7c4dff55}
h1{margin:6px 0 0;font-size:26px;letter-spacing:.2px}
p.sub{margin:0;color:#a6a3bd;font-size:14px}
.cards{display:flex;gap:16px;margin-top:10px}
.card{width:240px;padding:24px 14px 18px;border-radius:16px;text-align:center;background:#1e1e2f;border:2px solid #ffffff12;cursor:pointer;transition:transform .12s,border-color .12s;font:inherit;color:inherit}
.card:hover{transform:translateY(-3px)}
.card.y:hover{border-color:#ff3d57}.card.s:hover{border-color:#1ed760}
.card svg{width:44px;height:44px;margin-bottom:10px}
.card b{display:block;font-size:17px}.card small{display:block;color:#a6a3bd;margin:4px 0 14px;font-size:12px;min-height:30px}
.go{display:block;padding:9px 0;border-radius:22px;font-size:13px;font-weight:600}
.y .go{background:#ff0033;color:#fff}.s .go{background:#1db954;color:#06130a}
.note{font-size:12px;color:#7d7a96;margin-top:2px}
.me{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid #ffffff14;width:100%;max-width:496px;justify-content:center;font-size:13px;color:#a6a3bd}
.me a{display:flex;align-items:center;gap:8px;color:#eceaf7;text-decoration:none;padding:7px 14px;border-radius:20px;background:#ffffff0f;cursor:pointer}
.me a:hover{background:#ffffff1f}
.me svg{width:18px;height:18px;fill:currentColor}
</style></head><body>
<img class="logo" src="logo.png" alt="">
<h1>Bienvenido a Lite Music</h1>
<p class="sub">¿Qué servicio quieres usar? Podrás cambiarlo cuando quieras.</p>
<div class="cards">
  <button class="card y" data-s="ytm"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#ff0033"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M10 8.9v6.2l5.2-3.1z" fill="#fff"/></svg><b>YouTube Music</b><small>Inicia sesión con tu cuenta de Google</small><span class="go">Elegir</span></button>
  <button class="card s" data-s="spotify"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1ed760"/><path d="M5.6 9.2c4.2-1.2 8.9-.9 12.7 1.3M6.3 12.5c3.5-1 7.3-.7 10.5 1.1M7 15.6c2.8-.7 5.7-.5 8.2.9" fill="none" stroke="#06130a" stroke-width="1.7" stroke-linecap="round"/></svg><b>Spotify</b><small>Cuenta de Spotify o "Continuar con Google"</small><span class="go">Elegir</span></button>
</div>
<div class="note">La sesión se inicia en la propia página del servicio. Lite Music no guarda tu contraseña.</div>
<div class="me"><span>Hecho por Bautista Rubio</span>

<script>
const inv = (c, a) => window.__TAURI_INTERNALS__.invoke(c, a);
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => inv('choose_source', { source: b.dataset.s }));
