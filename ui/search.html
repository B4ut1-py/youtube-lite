<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lite Music Búsqueda</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  html, body { margin: 0; background: transparent; font: 13px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  body { padding: 18px; height: 100vh; box-sizing: border-box; }
  .box { --bg: rgba(22, 22, 30, .9); width: 520px; border-radius: 22px; padding: 8px; color: var(--text); background: var(--bg);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .32), inset 0 -1px 0 rgba(255, 255, 255, .08), 0 14px 32px rgba(0, 0, 0, .35); }
  html.light .box { --bg: rgba(255, 255, 255, .92); box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(255, 255, 255, .5), 0 14px 32px rgba(30, 40, 70, .25); }
  /* con Cristal toma el fondo elegido para la app */
  html.tint .box { --bg: color-mix(in srgb, color-mix(in srgb, var(--lm-tint) 78%, #000) 94%, transparent); }
  html.tint.light .box { --bg: color-mix(in srgb, color-mix(in srgb, var(--lm-tint) 40%, #fff) 95%, transparent); }
  .in { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 14px; border-radius: 999px; background: rgba(255, 255, 255, .08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); }
  html.light .in { background: rgba(255, 255, 255, .7); box-shadow: inset 0 1px 1px rgba(0, 0, 0, .06); }
  .in svg { width: 18px; height: 18px; fill: currentColor; opacity: .7; flex: none; }
  #q { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: inherit; font-size: 15px; caret-color: #ff3d6e; }
  #q::placeholder { color: var(--dim); }
  .src { display: flex; gap: 6px; align-items: center; padding: 5px 10px; border-radius: 999px; font-size: 11.5px; background: rgba(255, 255, 255, .1); color: var(--dim); white-space: nowrap; }
  html.light .src { background: rgba(0, 0, 0, .05); }
  .src b { width: 7px; height: 7px; border-radius: 50%; background: #ff2d55; } .src.sp b { background: #1ed760; }
  .tabs { display: flex; gap: 6px; padding: 10px 6px 4px; }
  .tabs button { padding: 4px 12px; border: 0; border-radius: 999px; font: inherit; font-size: 12px; color: var(--dim); background: rgba(255, 255, 255, .06); cursor: pointer; }
  html.light .tabs button { background: rgba(0, 0, 0, .04); }
  .tabs button:hover { color: var(--text); } html .tabs button.on { background: #ff3d6e; color: #fff; }
  #list { max-height: 290px; overflow: hidden auto; scrollbar-width: none; }
  .r { display: flex; align-items: center; gap: 12px; padding: 7px 10px 7px 7px; margin-top: 2px; border-radius: 14px; cursor: pointer; }
  .r.on { background: rgba(255, 255, 255, .12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16); }
  html.light .r.on { background: rgba(255, 255, 255, .85); box-shadow: inset 0 1px 0 #fff, 0 2px 8px rgba(30, 40, 70, .1); }
  .c { width: 40px; height: 40px; border-radius: 9px; flex: none; object-fit: cover; background: rgba(255, 255, 255, .1); }
  .c.round { border-radius: 50%; }
  .t { flex: 1; min-width: 0; } .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t .a { color: var(--dim); font-size: 12px; margin-top: 1px; }
  .d { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .play { width: 28px; height: 28px; border-radius: 50%; background: #ff3d6e; display: none; place-items: center; flex: none; box-shadow: 0 2px 8px rgba(255, 61, 110, .45); }
  .r.on .play { display: grid; }
  .play svg { width: 13px; height: 13px; fill: #fff; margin-left: 2px; }
  .msg { padding: 18px 12px 10px; text-align: center; color: var(--dim); }
  .ft { display: flex; gap: 14px; justify-content: center; padding: 10px 0 4px; font-size: 11px; color: var(--dim); }
  kbd { font: inherit; padding: 1px 6px; border-radius: 6px; background: rgba(255, 255, 255, .1); color: var(--text); }
  html.light kbd { background: rgba(0, 0, 0, .06); }
</style>
</head>
<body>
<div class="box" id="box">
  <div class="in">
    <svg viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.3 4.3-1.4 1.4-4.3-4.3A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
    <input id="q" autocomplete="off" spellcheck="false" placeholder="Buscar canciones, álbumes, artistas o listas">
    <div class="src" id="src"><b></b><span>YouTube Music</span></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="on" data-k="all">Todo</button><button data-k="songs">Canciones</button><button data-k="albums">Álbumes</button><button data-k="artists">Artistas</button><button data-k="playlists">Listas</button>
  </div>
  <div id="list"></div>
  <div class="ft"><span><kbd>↑</kbd> <kbd>↓</kbd> elegir</span><span><kbd>Enter</kbd> reproducir</span><span><kbd>Tab</kbd> filtro</span><span><kbd>Esc</kbd> cerrar</span></div>
</div>
<script>
const inv = (c, a) => window.__TAURI_INTERNALS__.invoke(c, a);
const $q = document.getElementById('q'), $list = document.getElementById('list'), $tabs = document.getElementById('tabs');
const KINDS = ['all', 'songs', 'albums', 'artists', 'playlists'];
let kind = 'all', items = [], sel = 0, timer, source = 'ytm';

// tema: el de la app; con Cristal, el tono y el color de su fondo
async function look() {
  try {
    const v = await inv('get_settings');
    source = v.settings.source;
    applyTheme(v.settings.theme); applyTone(v.glass_spec ? v.glass_spec.tone : null);
    document.documentElement.classList.toggle('tint', !!v.glass_spec);
    if (v.glass_spec) document.documentElement.style.setProperty('--lm-tint', v.glass_spec.tint);
    const s = document.getElementById('src'); s.classList.toggle('sp', source === 'spotify');
    s.lastChild.textContent = source === 'spotify' ? 'Spotify' : 'YouTube Music';
  } catch (_) {}
}
const msg = (t) => { $list.replaceChildren(); const m = document.createElement('div'); m.className = 'msg'; m.textContent = t; $list.append(m); };
function draw() {
  if (!items.length) return msg($q.value.trim() ? 'Sin resultados' : 'Escribí para buscar');
  $list.replaceChildren(...items.map((it, i) => {
    const r = document.createElement('div'); r.className = 'r' + (i === sel ? ' on' : '');
    const img = document.createElement('img'); img.className = 'c' + (it.round ? ' round' : ''); img.alt = ''; if (it.img) img.src = it.img;
    const t = document.createElement('div'); t.className = 't';
    const a = document.createElement('div'); a.textContent = it.title;
    const b = document.createElement('div'); b.className = 'a'; b.textContent = [it.kind, it.sub].filter(Boolean).join(' · ');
    t.append(a, b);
    const d = document.createElement('span'); d.className = 'd'; d.textContent = it.dur || '';
    const p = document.createElement('span'); p.className = 'play'; p.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>';
    r.append(img, t, d, p);
    r.onmouseenter = () => { sel = i; mark(); };
    r.onclick = () => play(i);
    return r;
  }));
}
const mark = () => [...$list.children].forEach((r, i) => r.classList.toggle('on', i === sel));
async function run() {
  const q = $q.value.trim();
  if (!q) { items = []; return draw(); }
  msg('Buscando…');
  const res = await inv('search', { q, kind }).catch(() => ({ items: [], error: 'error' }));
  if (res.stale || q !== $q.value.trim()) return;   // ya se escribió otra cosa
  items = res.items || []; sel = 0;
  if (res.error && !items.length) return msg('No se pudo buscar. Probá de nuevo.');
  draw();
}
const play = (i) => { const it = items[i]; if (it) inv('search_play', { i, open: !!it.open }); };
function setKind(k) { kind = k; [...$tabs.children].forEach((b) => b.classList.toggle('on', b.dataset.k === k)); run(); }
$tabs.onclick = (e) => { const k = e.target.dataset && e.target.dataset.k; if (k) { setKind(k); $q.focus(); } };
$q.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 300); };
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); inv('search_hide'); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!items.length) return;
    sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; mark();
    $list.children[sel]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); play(sel); }
  else if (e.key === 'Tab') { e.preventDefault(); setKind(KINDS[(KINDS.indexOf(kind) + (e.shiftKey ? 4 : 1)) % 5]); }
});
// clic fuera de la caja (la ventana es más grande que ella): cerrar
document.body.addEventListener('mousedown', (e) => { if (!document.getElementById('box').contains(e.target)) inv('search_hide'); });
// la llama Rust cada vez que se vuelve a abrir
window.lmOpen = () => { look(); $q.focus(); $q.select(); };
look(); draw(); $q.focus();
</script>
</body>
</html>
