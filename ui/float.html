<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lite Music Float</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; padding-top: 6px; box-sizing: border-box;
         font: 400 13px var(--font); color: var(--text); cursor: default; }
  .card { position: relative; box-sizing: border-box; width: 288px; height: 116px; padding: 10px; display: flex; gap: 10px;
          border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
  /* recuadro de la izquierda: carátula, mascota o mood */
  .tile { position: relative; width: 96px; height: 96px; flex: none; border-radius: 12px; overflow: hidden; cursor: pointer;
          background: var(--surface2); }
  .tile canvas { position: absolute; left: 0; top: 0; width: 96px; height: 96px; image-rendering: pixelated; }
  .tile canvas.ch { left: 16px; top: 32px; width: 64px; height: 64px; }   /* personaje: 64 px dentro de la habitación */
  body.kind-animal .tile canvas.ch { top: 31px; }
  #head { transform-origin: 50% 80%; will-change: transform; }
  #cover { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .3s; }
  #scene, #fx { display: none; pointer-events: none; }
  body.kind-mood #scene { display: block; } body.kind-animal #fx { display: block; }
  body.kind-cover #cover { display: block; } body.kind-cover .tile canvas,
  body.kind-mood canvas#body, body.kind-mood canvas#head { display: none; }
  body.kind-cover.paused #cover { filter: brightness(.5) saturate(.7); }
  body.kind-none .tile { display: none; }
  /* textos y controles */
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #title { margin-top: 1px; font-size: 14.5px; font-weight: 650; white-space: nowrap; overflow: hidden; letter-spacing: -.1px; }
  #title span { display: inline-block; will-change: transform; }
  /* dos idas y vueltas y queda quieto al principio (moverse sin fin gasta procesador toda la canción); con el mouse encima
     vuelve a empezar: cambiar el nombre de la animación la reinicia */
  #title.marquee span { animation: slide var(--dur, 8s) ease-in-out 4 alternate; }
  body:hover #title.marquee span { animation-name: slide2; animation-iteration-count: infinite; }
  @keyframes slide { 0%, 12% { transform: translateX(0); } 88%, 100% { transform: translateX(var(--shift, 0px)); } }
  @keyframes slide2 { 0%, 12% { transform: translateX(0); } 88%, 100% { transform: translateX(var(--shift, 0px)); } }
  #artist { margin-top: 1px; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head { display: flex; align-items: flex-start; gap: 2px; }
  .txt { flex: 1; min-width: 0; }
  .ctr { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: auto; }
  .b { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--text); opacity: .8;
       display: grid; place-items: center; cursor: pointer; transition: transform .08s; }
  .b:hover { background: var(--hover); opacity: 1; } .b:active { transform: scale(.9); }
  .b svg { width: 18px; height: 18px; fill: currentColor; }
  #pp { width: 34px; height: 34px; margin: 0; border-radius: 50%; background: var(--accent); color: #fff; opacity: 1; box-shadow: 0 3px 10px #ff3d6e55; }
  #pp:hover { background: var(--accent); filter: brightness(1.08); }
  #like { width: 24px; height: 24px; margin: -2px -4px 0 0; } #like svg { width: 17px; height: 17px; } #like.on { color: var(--accent); opacity: 1; }
  .prog { display: flex; align-items: center; gap: 7px; margin-top: 7px; font-size: 10.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .prog span { min-width: 26px; } .prog span:last-child { text-align: right; }
  #bar { flex: 1; height: 4px; border-radius: 4px; background: var(--track); position: relative; cursor: pointer; }
  #bar::before, #vbar::before { content: ""; position: absolute; inset: -6px; }                      /* más fácil de acertar */
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 4px; background: var(--accent); }
  /* volumen vertical */
  #vcol { width: 14px; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 4px 0 1px; }
  #vbar { flex: 1; width: 4px; border-radius: 4px; background: var(--track); position: relative; cursor: pointer; }
  #vfill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; border-radius: 4px; background: var(--text); opacity: .8; }
  #vcol svg { width: 14px; height: 14px; fill: var(--dim); flex: none; }
  /* Pomodoro y temporizador: etiqueta sobre el borde de la tarjeta */
  #badge { position: absolute; top: -9px; right: 26px; padding: 2px 9px; border-radius: 99px; font-size: 10.5px; font-weight: 650;
           letter-spacing: .2px; color: #fff; background: var(--accent); box-shadow: 0 2px 8px #0004; display: none; font-variant-numeric: tabular-nums; }
  #badge.rest { background: #2f9e5c; } #badge.sleep { background: #5b6ee1; }
  /* ===== Estilo Cristal: vidrio translúcido con brillo en los bordes y botones tipo burbuja ===== */
  html.glass { --glass: rgba(30, 30, 40, .28); --rim: rgba(255, 255, 255, .38); --rim2: rgba(255, 255, 255, .1); --text: #fff; --dim: rgba(255, 255, 255, .74);
               --track: rgba(255, 255, 255, .22); --hover: rgba(255, 255, 255, .14); --tint: rgba(255, 255, 255, .1); }
  html.glass.light { --glass: rgba(255, 255, 255, .42); --rim: rgba(255, 255, 255, .85); --rim2: rgba(255, 255, 255, .35); --text: #14141a; --dim: rgba(20, 20, 26, .78);
                     --track: rgba(0, 0, 0, .14); --hover: rgba(255, 255, 255, .45); --tint: rgba(255, 255, 255, .35); }
  html.glass .card { background: var(--glass); border: 0; border-radius: 22px;
    box-shadow: inset 0 1px 0 var(--rim), inset 0 -1px 0 var(--rim2), inset 1px 0 0 var(--rim2), inset -1px 0 0 var(--rim2), 0 10px 26px rgba(0, 0, 0, .28); }
  /* brillo especular arriba a la izquierda, reflejo abajo y canto del vidrio */
  html.glass .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120% 90% at 8% -10%, rgba(255, 255, 255, .36), transparent 45%), radial-gradient(80% 60% at 100% 120%, rgba(255, 255, 255, .15), transparent 55%); }
  html.glass .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1.2px;
    background: linear-gradient(135deg, rgba(255, 255, 255, .75), rgba(255, 255, 255, .08) 35%, rgba(255, 255, 255, .04) 65%, rgba(255, 255, 255, .45));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  html.glass .tile { border-radius: 15px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .28), 0 4px 12px rgba(0, 0, 0, .18); }
  html.glass #title, html.glass #artist { text-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
  html.glass.light #title, html.glass.light #artist { text-shadow: 0 1px 1px rgba(255, 255, 255, .5); }
  html.glass .b { opacity: 1; }
  html.glass #prev, html.glass #next { background: var(--tint); border-radius: 50%; box-shadow: inset 0 1px 0 var(--rim), inset 0 -1px 0 var(--rim2); }
  html.glass #pp { background: linear-gradient(180deg, rgba(255, 110, 145, .95), rgba(255, 61, 110, .78));
    box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .65), inset 0 -2px 4px rgba(120, 0, 40, .25), 0 4px 14px rgba(255, 61, 110, .45); }
  html.glass #fill { background: linear-gradient(90deg, #ff6f95, #ff3d6e); box-shadow: 0 0 6px rgba(255, 61, 110, .6); }
  html.glass #bar, html.glass #vbar { box-shadow: inset 0 1px 1px rgba(0, 0, 0, .12); }
  html.glass #vfill { background: var(--text); opacity: .9; }
  html.glass #badge { background: rgba(255, 61, 110, .85); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 2px 8px #0003; }
  /* fondo: la carátula de la canción, muy desenfocada */
  #art { display: none; position: absolute; inset: 0; border-radius: inherit; overflow: hidden; z-index: -1;
         background: linear-gradient(135deg, #ff7a9c, #7a4dff); }
  html.glass #art { display: block; } html.glass .card { background: transparent; isolation: isolate; }
  #art img { position: absolute; left: -20%; top: -100%; width: 140%; height: 300%; object-fit: cover; filter: blur(26px) saturate(1.6) brightness(.8); }
  html.light #art img { filter: blur(26px) saturate(1.5) brightness(1.25); }
  #art::after { content: ""; position: absolute; inset: 0; background: var(--glass); }
  /* Transparente: el mismo vidrio, pero se ve la pantalla de atrás en vez de la carátula (la ventana ya es transparente) */
  html.glass.screen #art { display: none; }
  html.glass.screen .card { background: rgba(18, 18, 26, .42); }
  html.glass.screen.light .card { background: rgba(255, 255, 255, .55); }
  html.glass.screen #title, html.glass.screen #artist { text-shadow: 0 1px 3px rgba(0, 0, 0, .55); }
  html.glass.screen.light #title, html.glass.screen.light #artist { text-shadow: 0 1px 2px rgba(255, 255, 255, .8); }
  /* ===== Formato compacto: una sola fila (mascota o carátula chica, título, controles y progreso fino abajo) ===== */
  body.fmt-compact .card { height: 64px; padding: 8px 10px 8px 8px; align-items: center; }
  body.fmt-compact .tile { zoom: .5; border-radius: 20px; }                      /* el mismo recuadro de 96 a la mitad */
  body.fmt-compact .info { flex-direction: row; align-items: center; gap: 6px; }
  body.fmt-compact .head { flex: 1; min-width: 0; margin-right: 4px; }
  body.fmt-compact #title { font-size: 13.5px; }
  body.fmt-compact #like, body.fmt-compact #vcol, body.fmt-compact .prog span { display: none; }
  body.fmt-compact .prog { position: absolute; left: 66px; right: 12px; bottom: 5px; margin: 0; }
  body.fmt-compact.kind-none .prog { left: 12px; }
  body.fmt-compact #bar { height: 3px; }
  body.fmt-compact .ctr { margin: 0; gap: 4px; }
  body.fmt-compact #pp { width: 30px; height: 30px; } body.fmt-compact #pp svg { width: 16px; height: 16px; }
  /* ===== Formato ultra compacto: cápsula con la carátula (anillo de progreso), título y play ===== */
  body.fmt-mini .card { width: 176px; height: 40px; padding: 4px 6px 4px 4px; gap: 8px; align-items: center; border-radius: 999px; }
  body.fmt-mini .tile { width: 32px; height: 32px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p, 0) * 1turn), var(--track) 0); }
  body.fmt-mini #cover { inset: 3px; width: 26px; height: 26px; border-radius: 50%; }
  body.fmt-mini .info { flex-direction: row; align-items: center; gap: 2px; }
  body.fmt-mini .head { flex: 1; min-width: 0; margin-right: 4px; }
  body.fmt-mini #title { margin: 0; font-size: 12.5px; }
  body.fmt-mini #artist, body.fmt-mini #like, body.fmt-mini .prog, body.fmt-mini #vcol { display: none; }
  body.fmt-mini .ctr { margin: 0; gap: 2px; }
  body.fmt-mini #prev, body.fmt-mini #next { width: 24px; height: 24px; } body.fmt-mini .b svg { width: 15px; height: 15px; }
  body.fmt-mini #pp { width: 28px; height: 28px; }
  body.fmt-mini:not(:hover) #prev, body.fmt-mini:not(:hover) #next { display: none; }   /* aparecen al pasar el mouse */
  /* lupa arriba a la derecha, solo en el formato normal; el corazón va al final de la fila de controles */
  #find { width: 24px; height: 24px; margin: -2px -4px 0 0; } #find svg { width: 16px; height: 16px; }
  body:not(.fmt-normal) #find { display: none; }
  body.fmt-normal .ctr { justify-content: flex-start; }
  .ctr #like { margin: 0 0 0 auto; }
  /* Isla: pliegue pegado al borde de arriba de la pantalla, con el estilo elegido (Normal, Cristal o Transparente).
     Cerrada muestra carátula, título y barritas; al pasar el mouse la ventana crece (Rust) y se despliega como el
     reproductor normal: carátula grande a la izquierda y el resto a la derecha. */
  body.fmt-island { padding: 0; align-items: flex-start; --isl-bg: var(--card); }
  html.glass.screen body.fmt-island { --isl-bg: rgba(18, 18, 26, .42); }
  html.glass.screen.light body.fmt-island { --isl-bg: rgba(255, 255, 255, .55); }
  /* Cristal: un solo color liso para la isla y sus aletas (el color medio de la carátula, o el fondo de la app); la carátula
     desenfocada no se puede continuar en las aletas y además dejaba un borde de otro color */
  html.glass:not(.screen) body.fmt-island { --isl-bg: var(--isl-avg, rgba(30, 30, 40, .9)); }
  /* con el fondo de la app, el mismo color que la barra de arriba de la ventana (va después y con el mismo peso que la regla de arriba: gana) */
  html.glass.appbg:not(.screen) body.fmt-island { --isl-bg: color-mix(in srgb, var(--lm-tint) 75%, #000); }
  html.glass.appbg.light:not(.screen) body.fmt-island { --isl-bg: color-mix(in srgb, var(--lm-tint) 40%, #fff); }
  body.fmt-island #art { display: none !important; }
  body.fmt-island .card { --f: 14px; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 230px; height: 34px;
    padding: 0 14px 2px 8px; gap: 9px; align-items: center; border: 0; border-radius: 0 0 18px 18px; background: var(--isl-bg) !important;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .28); overflow: visible;
    transition: width .32s cubic-bezier(.3, 1.25, .5, 1), height .32s cubic-bezier(.3, 1.25, .5, 1), border-radius .32s, padding .32s; }
  html.glass body.fmt-island .card::before, html.glass body.fmt-island .card::after { display: none; }
  body.fmt-island #vcol, body.fmt-island #badge { display: none !important; }
  /* aletas cóncavas que unen la isla con el borde de la pantalla, del mismo color que la isla */
  .fin { display: none; }
  body.fmt-island .fin { display: block; position: absolute; top: 0; width: var(--f); height: var(--f); transition: width .32s, height .32s; }
  body.fmt-island .fin.l { left: calc(-1 * var(--f)); background: radial-gradient(circle at 0 100%, transparent var(--f), var(--isl-bg) calc(var(--f) + .5px)); }
  body.fmt-island .fin.r { right: calc(-1 * var(--f)); background: radial-gradient(circle at 100% 100%, transparent var(--f), var(--isl-bg) calc(var(--f) + .5px)); }
  body.fmt-island .tile { width: 22px; height: 22px; border-radius: 50%; background: none; transition: width .32s, height .32s, border-radius .32s; }
  body.fmt-island #cover { border-radius: inherit; }
  body.fmt-island .info { flex-direction: row; align-items: center; gap: 6px; }
  body.fmt-island .head { flex: 1; min-width: 0; }
  body.fmt-island #title { margin: 0; font-size: 12px; }
  body.fmt-island #artist, body.fmt-island #find, body.fmt-island .prog, body.fmt-island .ctr { display: none; }
  #eq { display: none; gap: 2.5px; align-items: center; height: 14px; flex: none; }
  body.fmt-island:not(.isl-open) #eq { display: flex; }
  #eq i { width: 3px; height: 14px; border-radius: 2px; background: var(--accent); transform-origin: center; transform: scaleY(.35); }
  /* barritas: solo se mueven mientras suena, a pocos cuadros por segundo (gasta casi nada) */
  body.fmt-island:not(.paused) #eq i { animation: eq .9s steps(5) infinite alternate; }
  #eq i:nth-child(2) { animation-delay: -.3s !important; } #eq i:nth-child(3) { animation-delay: -.6s !important; }
  #eq i:nth-child(4) { animation-delay: -.15s !important; } #eq i:nth-child(5) { animation-delay: -.45s !important; }
  @keyframes eq { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
  /* abierta: igual que el reproductor normal */
  body.fmt-island.isl-open .card { --f: 22px; width: 380px; height: 124px; padding: 12px 14px 12px 12px; gap: 12px; align-items: stretch; border-radius: 0 0 30px 30px; }
  body.fmt-island.isl-open .tile { width: 100px; height: 100px; border-radius: 14px; }
  body.fmt-island.isl-open .info { flex-direction: column; align-items: stretch; gap: 0; }
  body.fmt-island.isl-open .head { flex: none; }
  body.fmt-island.isl-open #title { font-size: 14px; margin-top: 2px; }
  body.fmt-island.isl-open #artist { display: block; }
  body.fmt-island.isl-open #find { display: grid; }
  body.fmt-island.isl-open .prog { display: flex; }
  body.fmt-island.isl-open .ctr { display: flex; justify-content: flex-start; }
  body.fmt-island.isl-open .ctr #like { margin: 0 0 0 auto; }
  /* al abrir, el contenido aparece cuando la isla terminó de crecer; al cerrar, se va antes de que se achique */
  body.fmt-island .info > *, body.fmt-island #eq { transition: opacity .15s; }
  body.fmt-island.isl-open:not(.isl-ready) .info > * { opacity: 0; }
  body.fmt-island.isl-closing .info > *, body.fmt-island.isl-closing #eq { opacity: 0; }
  /* Cristal con el fondo de la app (opcional): el mismo degradé fijo que YouTube Music, Spotify y las ventanas */
  html.appbg #art img { display: none; }
  html.appbg #art { background: radial-gradient(70% 60% at 12% 8%, color-mix(in srgb, var(--lm-tint) 70%, #fff), transparent 70%),
    radial-gradient(60% 70% at 92% 92%, color-mix(in srgb, var(--lm-tint) 65%, #000), transparent 72%),
    linear-gradient(160deg, color-mix(in srgb, var(--lm-tint) 88%, #fff), color-mix(in srgb, var(--lm-tint) 80%, #000)); }
</style>
</head>
<body>
<div class="card" id="card">
  <div id="art"><img id="artimg" alt=""></div>
  <div class="tile" id="stage" title="Clic: pausar / reanudar · Arrastra para mover · Rueda: volumen · Ctrl + rueda: tamaño">
    <canvas id="bg" width="96" height="96"></canvas>
    <canvas class="ch" id="body" width="64" height="64"></canvas>
    <canvas class="ch" id="head" width="64" height="64"></canvas>
    <canvas class="ch" id="scene" width="64" height="64"></canvas>
    <canvas class="ch" id="fx" width="64" height="64"></canvas>
    <img id="cover" alt="">
  </div>
  <div class="info">
    <div class="head">
      <div class="txt"><div id="title"><span>Lite Music</span></div><div id="artist"></div></div>
      <button class="b" id="find" title="Buscar (Ctrl + Shift + Espacio)"><svg viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.3 4.3-1.4 1.4-4.3-4.3A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg></button>
    </div>
    <div class="prog"><span id="tcur">0:00</span><div id="bar"><div id="fill"></div></div><span id="tdur">0:00</span></div>
    <div class="ctr">
      <button class="b" id="prev" title="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button class="b" id="pp" title="Reproducir"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
      <button class="b" id="next" title="Siguiente"><svg viewBox="0 0 24 24"><path d="M15.8 5H18v14h-2.2zM4 5l10.5 7L4 19z"/></svg></button>
      <button class="b" id="like" title="Me gusta"><svg viewBox="0 0 24 24" id="likei"></svg></button>
    </div>
  </div>
  <div id="vcol" title="Volumen (también con la rueda del mouse)">
    <div id="vbar"><div id="vfill"></div></div>
    <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6z"/></svg>
  </div>
  <div id="badge"></div>
  <i class="fin l"></i><i class="fin r"></i>
  <div id="eq"><i></i><i></i><i></i><i></i><i></i></div>
</div>
<script>
const inv = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
const $ = (id) => document.getElementById(id);
applyTheme('auto');

/* ---------- Pixel art (rejilla 48x48) ---------- */
const DARK = '#2a2233';
// contorno selectivo: el tono de la sombra llevado hacia un violeta oscuro
const mixc = (a, b, k) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(a.substr(i, 2), 16) * (1 - k) + parseInt(b.substr(i, 2), 16) * k).toString(16).padStart(2, '0')).join('');
const OUT = (c) => mixc(c, '#1c1030', .62);
// Rejilla escalable: el mismo dibujo se rasteriza a S veces más resolución (S = 4/3: de 48 a 64 píxeles)
let S = 4 / 3;
const px = (c, x, y, w, h, col) => { c.fillStyle = col; const X = Math.round(x * S), Y = Math.round(y * S); c.fillRect(X, Y, Math.max(1, Math.round((x + w) * S) - X), Math.max(1, Math.round((y + h) * S) - Y)); };
const ell = (c, cx, cy, rx, ry, col) => {
  cx *= S; cy *= S; rx *= S; ry *= S;
  c.fillStyle = col;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++)
      if (((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2 <= 1) c.fillRect(x, y, 1, 1);
};
// Elipse con contorno, sombra inferior-derecha y luz superior-izquierda
const blob = (c, cx, cy, rx, ry, col, shade, light) => {
  ell(c, cx, cy, rx + 1, ry + 1, OUT(shade));
  ell(c, cx, cy, rx, ry, shade);
  ell(c, cx - .7, cy - .7, rx - 1.2, ry - 1.2, col);
  if (light) ell(c, cx - rx * .35, cy - ry * .45, rx * .35, ry * .22, light);
};
const ring = (c, cx, cy, orx, ory, irx, iry, col, maxY, only) => {
  [cx, cy, orx, ory, irx, iry, maxY] = [cx, cy, orx, ory, irx, iry, maxY].map((v) => v * S);
  c.fillStyle = col;
  for (let y = Math.floor(cy - ory); y <= maxY; y++)

      const b = Math.sin(Math.PI * u);
      if (fx.name === 'next') { rx = 9 * b; rrot = 10 * b; }
      else if (fx.name === 'prev') { rx = -9 * b; rrot = -10 * b; }
      else if (fx.name === 'song') { rrot = 13 * Math.sin(Math.PI * Math.min(1, u * 1.6)); }
      else if (fx.name === 'resume') { hop = 12 * b; }
      else if (fx.name === 'yawn') { rrot = -7 * b; dip = -2 * b; }
      else if (fx.name === 'volup') { rx = (Math.random() - .5) * 4 * b; dip = (Math.random() - .5) * 3 * b; }   // los auriculares vibran
      else if (fx.name === 'voldown') { dip = 5 * b; rrot = -5 * b; }
      else if (fx.name === 'wave') {                                     // saludo con la patita
        rrot = 5 * Math.min(1, b * 2.5); rx = 2 * Math.min(1, b * 2.5);
        if (now - lastWave > 90) { lastWave = now; drawBody(skin, 0); drawWavePaw(skin, u * Math.PI * 2 * 4); }
      }
      drawFx(u, fx.name);
    }
  }
  const skew = s1 * 3.5 * amp;
  // sin redondear: la rotación ya suaviza los píxeles, y redondear el desplazamiento lo hacía avanzar a saltos de 1 px
  bodyEl.style.transform = `translateY(${(-hop * K).toFixed(2)}px) skewX(${skew.toFixed(2)}deg)`;
  const neck = -Math.tan(skew * Math.PI / 180) * 50 * K;
  head.style.transform = `translate(${(neck + (s2 * 5 * amp + rx) * K).toFixed(2)}px, ${((slump * 5 - hop + dip) * K).toFixed(2)}px) rotate(${(s2 * 5 * amp + rrot - slump * 4).toFixed(2)}deg)`;
  // se detiene del todo cuando no hay nada que animar (ahorra CPU)
  if (kind === 'animal' && (playing || amp > 0.01 || Math.abs(slump - (playing ? 0 : 1)) > 0.01 || fx)) raf = requestAnimationFrame(frame);
}

/* ---------- Moods: personas, pixel art a ~12 fps solo mientras suena ---------- */
let mood = null, moodTimer = 0, moodT = 0;
function drawMoodFrame() {
  if (!mood || !window.SCENES) return;
  const c = document.getElementById('scene').getContext('2d');
  c.clearRect(0, 0, 64, 64);
  SCENES[mood.mood](c, moodT, mood.action, !playing);
}
function moodStart() {
  moodStop(); let prev = performance.now();
  moodTimer = setInterval(() => {
    const now = performance.now(); if (!playing) { prev = now; return; }
    moodT += (now - prev) / 1000; prev = now;
    moodTick(mood, moodT); drawMoodFrame();
  }, 83);
  setTimeout(drawMoodFrame, 50);
}
function moodStop() { if (moodTimer) clearInterval(moodTimer); moodTimer = 0; }

/* ---------- Interacción ---------- */
const stage = $('stage');
let down = null;
document.body.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || e.target.closest('.b') || e.target.closest('#bar') || e.target.closest('#vcol')) return;
  down = { x: e.screenX, y: e.screenY, onStage: !!e.target.closest('#stage'), moved: false };
});
document.body.addEventListener('mousemove', (e) => {
  if (format === 'island') return;   // la isla tiene lugar fijo
  if (down && !down.moved && Math.hypot(e.screenX - down.x, e.screenY - down.y) > 4) {
    down.moved = true; inv('plugin:window|start_dragging').catch(() => {});
  }
});
document.body.addEventListener('mouseup', () => {
  if (down && down.onStage && !down.moved) inv('control', { action: 'playpause' });
  down = null;
});
$('pp').onclick = () => inv('control', { action: 'playpause' });
let lastActivity = Date.now(), lastYawn = 0, lv = null, lastVolFx = 0, curVol = 1;
['mousedown', 'wheel'].forEach((ev) => window.addEventListener(ev, () => { lastActivity = Date.now(); }, true));
// Bostezo: si llevas un rato sin tocar el flotante y suena música (como máximo uno cada 2 min).
setInterval(() => {
  const now = Date.now();
  if (playing && kind === 'animal' && !fx && now - lastActivity > CFG.yawn_idle_s * 1000 && now - lastYawn > 120000) { lastYawn = now; trigger('yawn'); }
}, 5000);
// Volumen vertical: arriba = 100 %, abajo = 0 %.
const vbar = $('vbar');
const setVol = (e) => {
  const r = vbar.getBoundingClientRect();
  const v = Math.min(1, Math.max(0, (r.bottom - e.clientY) / r.height));
  $('vfill').style.height = Math.round(v * 100) + '%';
  inv('control', { action: 'volume', value: v });
  lastActivity = Date.now();
  if (lv === null) lv = curVol;
  const now = Date.now();
  if (Math.abs(v - lv) >= 0.15 && now - lastVolFx > 1200) { trigger(v > lv ? 'volup' : 'voldown'); lastVolFx = now; lv = v; }
};
vbar.addEventListener('mousedown', (e) => { draggingVol = true; lv = null; setVol(e); e.stopPropagation(); });
window.addEventListener('mousemove', (e) => { if (draggingVol) setVol(e); });
window.addEventListener('mouseup', () => { draggingVol = false; lv = null; });
$('prev').onclick = () => { trigger('prev'); inv('control', { action: 'prev' }); };
$('next').onclick = () => { trigger('next'); inv('control', { action: 'next' }); };
$('like').onclick = () => inv('control', { action: 'like' });
$('find').onclick = () => inv('control', { action: 'search' });
const refit = () => { const t = shownTitle; shownTitle = null; setTitle(t); };   // el título vuelve a medir si entra (con o sin desplazarse)
// Isla con Cristal: las aletas toman el color medio de la carátula (una vez por canción; si el servidor no lo permite,
// quedan con el vidrio oscuro de siempre)
function islAvg(url) {
  if (!url) return;
  const im = new Image(); im.crossOrigin = 'anonymous';
  im.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 1;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, 1, 1);
      const [r, g, b] = x.getImageData(0, 0, 1, 1).data;
      const veil = document.documentElement.classList.contains('light') ? '#fff' : '#1e1e28';
      document.body.style.setProperty('--isl-avg', `color-mix(in srgb, rgb(${r} ${g} ${b}) 70%, ${veil})`);
    } catch (_) {}
  };
  im.src = url;
}
// Isla: al entrar el mouse la ventana crece y la tarjeta se despliega; al salir se repliega y después la ventana se achica.
let islT = null;
document.documentElement.addEventListener('mouseenter', () => {
  if (format !== 'island') return;
  clearTimeout(islT); document.body.classList.remove('isl-closing');
  if (document.body.classList.contains('isl-open')) return;
  inv('control', { action: 'island', value: 1 });
  requestAnimationFrame(() => document.body.classList.add('isl-open'));
  islT = setTimeout(() => { document.body.classList.add('isl-ready'); refit(); }, 330);
});
document.documentElement.addEventListener('mouseleave', () => {
  if (format !== 'island') return;
  clearTimeout(islT);
  islT = setTimeout(() => {                               // primero se va el contenido, después se achica la isla y al final la ventana
    document.body.classList.add('isl-closing');
    islT = setTimeout(() => {
      document.body.classList.remove('isl-ready', 'isl-open');
      islT = setTimeout(() => { document.body.classList.remove('isl-closing'); refit(); inv('control', { action: 'island', value: 0 }); }, 330);
    }, 150);
  }, 250);
});
$('bar').onclick = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  inv('control', { action: 'seek', value: (e.clientX - r.left) / r.width });
};
// Rueda del mouse: volumen; con Ctrl, tamaño del flotante
document.body.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.ctrlKey) inv('scale_float', { delta: e.deltaY < 0 ? 0.1 : -0.1 });
  else inv('control', { action: 'volume_step', value: e.deltaY < 0 ? 0.05 : -0.05 });
}, { passive: false });

// en el ultra compacto, anterior y siguiente aparecen con el mouse encima y el título cambia de ancho
['mouseenter', 'mouseleave'].forEach((ev) => document.body.addEventListener(ev, () => { if (format === 'mini') { const t = shownTitle; shownTitle = null; setTitle(t); } }));
$('likei').innerHTML = ICON.heartO;
if (window.__TAURI_INTERNALS__) { poll(); setInterval(poll, 500); }
kick();
window.__render = render; // para pruebas
</script>
