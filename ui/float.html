<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lite Music Float</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;
         font: 700 12px "Courier New", monospace; color: #fff; cursor: default; }
  #wrap { width: 320px; }
  #row { display: flex; align-items: center; justify-content: space-between; }
  #stage { position: relative; width: 192px; height: 192px; cursor: pointer; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 192px; height: 192px; image-rendering: pixelated; }
  #head { transform-origin: 50% 80%; will-change: transform; }
  .btn { width: 40px; height: 40px; padding: 0; border: 0; background: transparent; cursor: pointer;
         image-rendering: pixelated; filter: drop-shadow(0 0 2px #000a); transition: transform .1s; }
  .btn:hover { transform: scale(1.15); } .btn:active { transform: scale(.92); }
  .btn canvas { width: 40px; height: 40px; image-rendering: pixelated; display: block; }
  #bar { margin: 10px 12px 0; height: 8px; position: relative; cursor: pointer;
         background: #0008; box-shadow: 0 0 0 2px #000a; image-rendering: pixelated; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #ff2d55; transition: width .25s linear; }
  #pp { display: none; }
  #cover { display: none; position: absolute; left: 10px; top: 10px; width: 172px; height: 172px; object-fit: cover;
           border-radius: 14px; box-shadow: 0 0 0 2px #000c, 0 6px 14px #0009; transition: filter .3s, transform .3s; }
  #scene, #fx { display: none; pointer-events: none; }
  body.kind-mood #scene { display: block; } body.kind-animal #fx { display: block; } body.kind-mood #fx { display: none; }
  body.kind-cover #cover { display: block; } body.kind-cover canvas#body, body.kind-cover canvas#head { display: none; }
  body.kind-cover.paused #cover { filter: brightness(.55) saturate(.7); transform: scale(.97); }
  body.kind-mood canvas#body, body.kind-mood canvas#head, body.kind-none canvas#body, body.kind-none canvas#head { display: none; }
  body.kind-none #stage { display: none; } body.kind-none #pp { display: block; }
  body.kind-none #row { justify-content: center; gap: 14px; margin: 6px 0; }
  #volrow { margin: 7px auto 0; width: 150px; display: flex; align-items: center; gap: 8px; }
  #vicon { width: 22px; height: 22px; image-rendering: pixelated; filter: drop-shadow(0 0 2px #000a); }
  #vbar { flex: 1; height: 6px; position: relative; cursor: pointer; background: #0008; box-shadow: 0 0 0 2px #000a; }
  #vfill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #fff; }
  #title { margin: 10px 8px 0; text-align: center; white-space: nowrap; overflow: hidden; color: #fff;
           font-size: 16px; font-weight: 800; letter-spacing: .4px; }
  #title span { display: inline-block; will-change: transform;
    text-shadow: 2px 0 #000, -2px 0 #000, 0 2px #000, 0 -2px #000, 1px 1px #000, -1px -1px #000, 1px -1px #000, -1px 1px #000, 0 3px 6px #000c; }
  #title.marquee { text-align: left; }
  #title.marquee span { animation: slide var(--dur, 8s) ease-in-out infinite alternate; }
  @keyframes slide { 0%, 12% { transform: translateX(0); } 88%, 100% { transform: translateX(var(--shift, 0px)); } }
  #artist { margin: 3px 8px 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            font-size: 12px; font-weight: 700; color: #f0f0f4; letter-spacing: .3px;
            text-shadow: 2px 0 #000, -2px 0 #000, 0 2px #000, 0 -2px #000, 1px 1px #000, -1px -1px #000, 1px -1px #000, -1px 1px #000, 0 2px 5px #000c; }
</style>
</head>
<body>
<div id="wrap">
  <div id="row">
    <button class="btn" id="prev" title="Anterior"><canvas width="11" height="11"></canvas></button>
    <div id="stage" title="Clic: pausar / reanudar. Arrastra para mover. Rueda: cambiar tamaño.">
      <canvas id="body" width="48" height="48"></canvas>
      <canvas id="head" width="48" height="48"></canvas>
      <canvas id="scene" width="48" height="48"></canvas>
      <canvas id="fx" width="48" height="48"></canvas>
      <img id="cover" alt="">
    </div>
    <button class="btn" id="pp" title="Reproducir / pausar"><canvas width="11" height="11"></canvas></button>
    <button class="btn" id="next" title="Siguiente"><canvas width="11" height="11"></canvas></button>
  </div>
  <div id="bar"><div id="fill"></div></div>
  <div id="title"><span>Lite Music</span></div>
  <div id="artist"></div>
  <div id="volrow" title="Volumen"><canvas id="vicon" width="11" height="11"></canvas><div id="vbar"><div id="vfill"></div></div></div>
</div>
<script>
const inv = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);

/* ---------- Pixel art (rejilla 48x48) ---------- */
const DARK = '#2a2233';
const px = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
const ell = (c, cx, cy, rx, ry, col) => {
  c.fillStyle = col;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++)
      if (((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2 <= 1) c.fillRect(x, y, 1, 1);
};
// Elipse con contorno, sombra inferior-derecha y luz superior-izquierda
const blob = (c, cx, cy, rx, ry, col, shade, light) => {
  ell(c, cx, cy, rx + 1, ry + 1, DARK);
  ell(c, cx, cy, rx, ry, shade);
  ell(c, cx - .7, cy - .7, rx - 1.2, ry - 1.2, col);
  if (light) ell(c, cx - rx * .35, cy - ry * .45, rx * .35, ry * .22, light);
};
const ring = (c, cx, cy, orx, ory, irx, iry, col, maxY, only) => {
  c.fillStyle = col;
  for (let y = Math.floor(cy - ory); y <= maxY; y++)
    for (let x = Math.floor(cx - orx); x <= Math.ceil(cx + orx); x++) {
      const o = ((x + .5 - cx) / orx) ** 2 + ((y + .5 - cy) / ory) ** 2;
      const i = ((x + .5 - cx) / irx) ** 2 + ((y + .5 - cy) / iry) ** 2;
      if (o <= 1 && i >= 1 && (!only || only(x, y))) c.fillRect(x, y, 1, 1);
    }
};
const tri = (c, p, col) => {
  const [x1, y1, x2, y2, x3, y3] = p;
  const d = (x1 - x3) * (y2 - y3) - (x2 - x3) * (y1 - y3);
  c.fillStyle = col;
  for (let y = Math.min(y1, y2, y3); y <= Math.max(y1, y2, y3); y++)
    for (let x = Math.min(x1, x2, x3); x <= Math.max(x1, x2, x3); x++) {
      const a = ((x - x3) * (y2 - y3) - (x2 - x3) * (y - y3)) / d;
      const b = ((x1 - x3) * (y - y3) - (x - x3) * (y1 - y3)) / d;
      if (a >= 0 && b >= 0 && a + b <= 1) c.fillRect(x, y, 1, 1);
    }
};
const SKINS = {
  dog: { fur: '#e0a867', shade: '#b97f45', ear: '#7b4a28', earS: '#5e3519', muzzle: '#fbf0dc', muzzleS: '#e3cfae' },
  cat: { fur: '#a9b2c4', shade: '#7e889d', ear: '#7e889d', earS: '#5f6a80', muzzle: '#f1f4fa', muzzleS: '#cfd6e3' },
};
const PHONE = '#ff3b66', PHONE_S = '#b81c43', PHONE_L = '#ff8fa8', BAND = '#3d3d52', BAND_L = '#6a6a88', PINK = '#ff8fa3';

// wave = fase de la animación del saludo (undefined = pose normal): la patita derecha se levanta y se mueve.
function drawBody(skin, wave) {
  const c = document.getElementById('body').getContext('2d'), s = SKINS[skin];
  c.clearRect(0, 0, 48, 48);
  blob(c, 24, 46, 14, 10, s.fur, s.shade, null);
  ell(c, 24, 44, 6, 6, s.muzzle); ell(c, 25, 46, 5, 4, s.muzzleS); ell(c, 24, 44, 5, 5, s.muzzle);
  blob(c, 16, 47, 4, 3, s.muzzle, s.muzzleS, null);
  if (wave === undefined) blob(c, 32, 47, 4, 3, s.muzzle, s.muzzleS, null);
  px(c, 22, 40, 1, 2, s.muzzleS); px(c, 26, 41, 1, 2, s.muzzleS);                       // pelo del pecho
}
// La patita que saluda se dibuja en la capa de efectos (encima de la cabeza y de las orejas).
function drawWavePaw(skin, wave) {
  const c = document.getElementById('fx').getContext('2d'), s = SKINS[skin];
  c.clearRect(0, 0, 48, 48);
  const hx = 41 + 3 * Math.sin(wave), hy = 37 - 1.2 * Math.abs(Math.cos(wave));
  const link = (r, col) => { for (let i = 0; i <= 10; i++) ell(c, 31 + (hx - 31) * i / 10, 45 + (hy - 45) * i / 10, r, r, col); };
  link(3.9, DARK); link(3, s.fur);                                                      // brazo
  blob(c, hx, hy, 3.9, 3.5, s.muzzle, s.muzzleS, null);                                 // patita
  const x = Math.round(hx), y = Math.round(hy);
  px(c, x - 2, y, 1, 1, PINK); px(c, x, y, 1, 1, PINK); px(c, x + 1, y, 1, 1, PINK); px(c, x - 1, y + 1, 2, 1, PINK);
}
function drawHead(skin, sleeping, c0, blink) {
  const c = c0 || document.getElementById('head').getContext('2d'), s = SKINS[skin];
  c.clearRect(0, 0, 48, 48);
  // diadema: anillo grueso con contorno, sombra y brillo (solo la mitad superior)
  ring(c, 24, 25, 21.5, 21, 17, 16.5, DARK, 25);
  ring(c, 24, 25, 20.5, 20, 18, 17.5, BAND, 25);
  ring(c, 24, 25, 20.5, 20, 19.4, 18.9, BAND_L, 25, (x, y) => x + y < 36);
  if (skin === 'dog') {
    blob(c, 9, 26, 5.5, 12, s.ear, s.earS, null); blob(c, 39, 26, 5.5, 12, s.ear, s.earS, null); // orejas caídas
    blob(c, 24, 22, 15, 13.5, s.fur, s.shade, '#f2c58c');                                         // cabeza
    px(c, 23, 9, 2, 8, s.muzzle); px(c, 22, 14, 4, 3, s.muzzle);                                  // franja
    px(c, 12, 14, 4, 1, s.ear); px(c, 32, 14, 4, 1, s.ear);                                       // cejas
    blob(c, 24, 29, 8, 5.5, s.muzzle, s.muzzleS, null);                                           // hocico
    ell(c, 24, 25, 3.5, 2.5, DARK); px(c, 22, 24, 2, 1, '#8a7fa0');                               // nariz + brillo
    if (!sleeping) {                                                                               // lengua
      px(c, 22, 31, 5, 4, DARK); px(c, 23, 35, 3, 1, DARK);
      px(c, 23, 31, 3, 3, PINK); px(c, 24, 34, 1, 1, PINK); px(c, 24, 32, 1, 2, '#d4607a');
      px(c, 23, 31, 1, 1, '#ffc2cf');
    }
    px(c, 24, 27, 1, 3, DARK); px(c, 21, 30, 3, 1, DARK); px(c, 25, 30, 3, 1, DARK);             // boca
    px(c, 20, 29, 1, 1, DARK); px(c, 28, 29, 1, 1, DARK);
    ell(c, 12, 26, 2.2, 1.5, '#f2907f'); ell(c, 36, 26, 2.2, 1.5, '#f2907f');                    // rubor
    [[17, 19], [31, 19]].forEach(([x, y]) => {                                                     // ojos
      if (sleeping || blink) { px(c, x - 2, y + 1, 5, 1, DARK); px(c, x - 3, y, 1, 1, DARK); px(c, x + 3, y, 1, 1, DARK); }
      else { ell(c, x, y, 2.6, 3.4, DARK); px(c, x - 1, y - 2, 2, 2, '#fff'); px(c, x + 1, y + 1, 1, 1, '#fff'); }
    });
  } else {
    tri(c, [8, 17, 12, 2, 22, 11], DARK); tri(c, [9, 16, 12, 4, 20, 11], s.ear); tri(c, [11, 14, 13, 7, 17, 11], PINK);   // orejas
    tri(c, [40, 17, 36, 2, 26, 11], DARK); tri(c, [39, 16, 36, 4, 28, 11], s.ear); tri(c, [37, 14, 35, 7, 31, 11], PINK);
    blob(c, 24, 24, 16.5, 12.5, s.fur, s.shade, '#c4cbd9');                                      // cabeza
    px(c, 23, 12, 2, 4, s.earS); px(c, 19, 13, 1, 3, s.earS); px(c, 28, 13, 1, 3, s.earS);       // rayas frente
    px(c, 9, 22, 3, 1, s.earS); px(c, 9, 25, 3, 1, s.earS); px(c, 36, 22, 3, 1, s.earS); px(c, 36, 25, 3, 1, s.earS);
    blob(c, 24, 30, 6.5, 4.5, s.muzzle, s.muzzleS, null);                                        // hocico
    tri(c, [22, 27, 26, 27, 24, 29], PINK);                                                      // nariz
    px(c, 24, 29, 1, 2, DARK); px(c, 21, 31, 3, 1, DARK); px(c, 25, 31, 3, 1, DARK);            // boca
    px(c, 22, 32, 1, 1, DARK); px(c, 27, 32, 1, 1, DARK);
    [[11, 30], [10, 32], [37, 30], [38, 32]].forEach(([x, y], i) => px(c, i < 2 ? x - 5 : x, y, 5, 1, '#e8edf7')); // bigotes
    ell(c, 13, 28, 2.2, 1.4, '#f2a3b4'); ell(c, 35, 28, 2.2, 1.4, '#f2a3b4');
    [[17, 21], [31, 21]].forEach(([x, y]) => {                                                     // ojos verdes
      if (sleeping || blink) { px(c, x - 2, y + 1, 5, 1, DARK); px(c, x - 3, y, 1, 1, DARK); px(c, x + 3, y, 1, 1, DARK); }
      else { ell(c, x, y, 3.2, 3.6, '#5ec27a'); ell(c, x, y, 3.2, 3.6, '#5ec27a'); px(c, x, y - 3, 1, 7, DARK);
             px(c, x - 1, y - 2, 2, 2, '#fff'); }
    });
  }
  // copas: carcasa chica, aro interior, almohadilla y bisagra con la diadema
  [[6, 1], [42, -1]].forEach(([cx, d]) => {
    px(c, cx - 1, 17, 3, 2, DARK); px(c, cx, 17, 1, 1, BAND);                                      // bisagra
    blob(c, cx, 25, 4, 6.5, PHONE, PHONE_S, PHONE_L);                                              // carcasa
    ell(c, cx - d * .2, 25, 2.2, 3.8, PHONE_S); ell(c, cx - d * .2 - .3, 24.7, 1.7, 3.3, PHONE);   // aro
    px(c, cx - 1, 21, 1, 2, '#ffd0db');                                                            // brillo
    ell(c, cx + d * 3, 25, 1.2, 5, '#2a2233'); ell(c, cx + d * 2.8, 25, .7, 4, '#4a4262');          // almohadilla
  });
}
function drawGlyph(canvas, shape) {
  const c = canvas.getContext('2d');
  c.clearRect(0, 0, 11, 11);
  [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([ox, oy]) => shape(c, ox, oy, '#000'));
  shape(c, 0, 0, '#fff');
}
const skipShape = (dir) => (c, ox, oy, col) => {
  c.fillStyle = col;
  for (let i = 0; i < 4; i++) c.fillRect((dir > 0 ? 2 + i : 7 - i) + ox, 2 + i + oy, 1, 7 - 2 * i);
  c.fillRect((dir > 0 ? 7 : 2) + ox, 2 + oy, 1, 7);
};
const playShape = (c, ox, oy, col) => { c.fillStyle = col; for (let i = 0; i < 4; i++) c.fillRect(3 + i + ox, 2 + i + oy, 1, 7 - 2 * i); c.fillRect(3 + ox, 2 + oy, 1, 7); };
const pauseShape = (c, ox, oy, col) => { c.fillStyle = col; c.fillRect(3 + ox, 2 + oy, 2, 7); c.fillRect(7 + ox, 2 + oy, 2, 7); };
const speakerShape = (c, ox, oy, col) => {
  c.fillStyle = col; c.fillRect(1 + ox, 4 + oy, 2, 3); c.fillRect(3 + ox, 3 + oy, 1, 5); c.fillRect(4 + ox, 2 + oy, 1, 7);
  c.fillRect(6 + ox, 4 + oy, 1, 3); c.fillRect(8 + ox, 3 + oy, 1, 5);
};

/* ---------- Estado ---------- */
let skin = '', kind = '', playing = false, sleeping = null, seen = false, lastTitle = '';
let cover = '';
function render(st) {
  if (st.skin !== skin) {
    skin = st.skin; sleeping = null;
    document.body.className = document.body.className.replace(/\b(skin|kind)-\S+/g, '').trim();
    kind = ['dog', 'cat'].includes(skin) ? 'animal' : (skin === 'cover' || skin === 'none') ? skin : 'mood';
    document.body.classList.add('skin-' + skin, 'kind-' + kind);
    if (kind === 'animal') drawBody(skin);
    if (kind === 'mood') { mood = { mood: skin, action: null, next: 15 + Math.random() * 15 }; moodStart(); }
    else moodStop();
    kick();
  }
  const was = playing;
  playing = !!st.playing;
  if (seen) {                                                      // reacciones del animal
    if (was && !playing) trigger('pause');
    else if (!was && playing) trigger('resume');
    if (st.title && st.title !== lastTitle && lastTitle) trigger('song');
  }
  seen = true; if (st.title) lastTitle = st.title;
  if (was !== playing) { kick(); if (kind === 'mood') drawMoodFrame(); }
  document.body.classList.toggle('paused', !playing);
  if (sleeping !== !playing) {
    sleeping = !playing;
    if (kind === 'animal') drawHead(skin, sleeping);
  }
  if (was !== playing || !ppDrawn) { drawGlyph(document.querySelector('#pp canvas'), playing ? pauseShape : playShape); ppDrawn = true; }
  const url = st.cover || '';
  if (url !== cover) {
    cover = url; const img = document.getElementById('cover');
    if (url) img.src = url; else img.removeAttribute('src');
  }
  setTitle(st.title || 'Lite Music');
  document.getElementById('artist').textContent = st.artist || '';
  setProgress(st);
  if (!draggingVol) document.getElementById('vfill').style.width = Math.round((st.vol ?? 1) * 100) + '%';
}
// Parpadeo: cada 2.5-6 s mientras suena, cierra los ojos ~140 ms (a veces dos veces seguidas).
function blinkOnce(done) {
  if (!playing || kind !== 'animal') return done();
  drawHead(skin, false, null, true);
  setTimeout(() => { if (playing) drawHead(skin, false); done(); }, 140);
}
function scheduleBlink() {
  setTimeout(() => blinkOnce(() => {
    if (Math.random() < 0.25) setTimeout(() => blinkOnce(scheduleBlink), 200);
    else scheduleBlink();
  }), 2500 + Math.random() * 3500);
}
scheduleBlink();
// Saludo ocasional con la patita (cada 25-55 s, solo mientras suena y sin otra reacción en curso).
function scheduleWave() {
  setTimeout(() => { if (playing && kind === 'animal' && !fx) trigger('wave'); scheduleWave(); }, 25000 + Math.random() * 30000);
}
scheduleWave();
let ppDrawn = false, draggingVol = false, shownTitle = null;
// Línea de tiempo: se estima entre informes (cada ~0,5 s), llega al 100 % al final y vuelve a 0 sin deslizarse hacia atrás.
const prog = { pos: 0, dur: 0, at: 0, frac: 0 };
const fillEl = document.getElementById('fill');
function setProgress(st) {
  const pos = st.pos || 0, dur = st.dur || 0;
  if (pos !== prog.pos || dur !== prog.dur) { prog.pos = pos; prog.dur = dur; prog.at = performance.now(); }
}
function paintProgress() {
  let frac = 0;
  if (prog.dur > 0) {
    const est = Math.min(prog.dur, prog.pos + (playing ? (performance.now() - prog.at) / 1000 : 0));
    frac = prog.dur - est < 0.9 && playing ? 1 : est / prog.dur;       // cerca del final: completa la barra
  }
  if (frac < prog.frac - 0.15) {                                        // canción nueva: salto instantáneo al inicio
    fillEl.style.transition = 'none'; fillEl.style.width = (frac * 100) + '%';
    void fillEl.offsetWidth; fillEl.style.transition = '';
  } else fillEl.style.width = (frac * 100) + '%';
  prog.frac = frac;
}
setInterval(paintProgress, 250);
// Si el título no cabe, se desplaza suavemente de un lado a otro en vez de cortarse.
function setTitle(text) {
  if (text === shownTitle) return;
  shownTitle = text;
  const box = document.getElementById('title'), span = box.firstElementChild;
  span.textContent = text; box.classList.remove('marquee');
  const over = span.offsetWidth - box.clientWidth;
  if (over > 4) {
    box.style.setProperty('--shift', `-${over + 8}px`);
    box.style.setProperty('--dur', `${Math.max(5, over / 14)}s`);
    box.classList.add('marquee');
  }
}
async function poll() {
  try { render(await inv('get_state')); } catch (_) {}
}

/* ---------- Animación del animal: vaivén relajado, patitas firmes + reacciones ---------- */
const head = document.getElementById('head'), bodyEl = document.getElementById('body'), fxC = document.getElementById('fx').getContext('2d');
let lastWave = 0, t = 0, last = performance.now(), amp = 0, slump = 0, raf = 0, fx = null;
const PERIOD = 3.2;                       // segundos por vaivén completo (lento = relajado)
const FX_DUR = { wave: 2.8, pause: 3, resume: 0.7, song: 1.4, next: 0.7, prev: 0.7 };
// Reacciones a las acciones del usuario: pausa, reanudar, canción nueva, siguiente, anterior.
function trigger(name) { if (kind !== 'animal') return; if (fx && fx.name === 'wave') drawBody(skin); fx = { name, t0: performance.now() / 1000 }; kick(); }
function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
const glyphZ = (c, x, y, s) => { c.fillStyle = '#fff'; c.fillRect(x, y, s, 1); c.fillRect(x, y + s - 1, s, 1); for (let i = 0; i < s; i++) c.fillRect(x + s - 1 - i, y + i, 1, 1); };
const glyphNote = (c, x, y) => { c.fillStyle = '#000'; c.fillRect(x + 2, y - 1, 1, 6); c.fillRect(x + 2, y - 1, 4, 2); c.fillRect(x - 1, y + 3, 4, 3); c.fillStyle = '#fff'; c.fillRect(x + 3, y, 1, 5); c.fillRect(x + 3, y, 3, 1); c.fillRect(x, y + 4, 3, 2); };
function drawFx(u, name) {
  if (name === 'wave') return;                                       // la patita se dibuja aparte
  fxC.clearRect(0, 0, 48, 48);
  if (name === 'pause') {
    for (let i = 0; i < 3; i++) {
      const age = (u * 3 - i * 0.55); if (age < 0 || age > 1.6) continue;
      fxC.globalAlpha = Math.max(0, 1 - age / 1.6); glyphZ(fxC, Math.round(34 + age * 5 + i * 2), Math.round(10 - age * 9), 3 + i);
    }
  } else if (name === 'song') {
    fxC.globalAlpha = 1 - u; glyphNote(fxC, 40, Math.round(10 - u * 9));
  } else if (name === 'next' || name === 'prev') {
    const d = name === 'next' ? 1 : -1; fxC.globalAlpha = 1 - u;
    [0, 3, 6].forEach((dy, i) => { fxC.fillStyle = '#fff'; fxC.fillRect(24 + d * (14 + u * 7 + i), 16 + dy, 4 - i, 1); });
  }
  fxC.globalAlpha = 1;
}
function frame(now) {
  raf = 0;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  amp += ((playing ? 1 : 0) - amp) * Math.min(1, dt * 2.5);          // arranca y frena con suavidad
  slump += ((playing ? 0 : 1) - slump) * Math.min(1, dt * 5);        // al pausar, la cabeza se relaja hacia abajo
  if (playing) t += dt;
  const phase = t * 2 * Math.PI / PERIOD;
  const s1 = Math.sin(phase), s2 = Math.sin(phase - 0.9);            // cabeza llega un poco después -> "S"
  // reacción en curso
  let rx = 0, rrot = 0, hop = 0;
  if (fx) {
    const u = (now / 1000 - fx.t0) / FX_DUR[fx.name];
    if (u >= 1) { if (fx.name === 'wave') drawBody(skin); fx = null; fxC.clearRect(0, 0, 48, 48); }
    else {
      const b = Math.sin(Math.PI * u);
      if (fx.name === 'next') { rx = 9 * b; rrot = 10 * b; }
      else if (fx.name === 'prev') { rx = -9 * b; rrot = -10 * b; }
      else if (fx.name === 'song') { rrot = 13 * Math.sin(Math.PI * Math.min(1, u * 1.6)); }
      else if (fx.name === 'resume') { hop = 12 * b; }
      else if (fx.name === 'wave') {                                     // saludo con la patita
        rrot = 5 * Math.min(1, b * 2.5); rx = 2 * Math.min(1, b * 2.5);
        if (now - lastWave > 90) { lastWave = now; drawBody(skin, 0); drawWavePaw(skin, u * Math.PI * 2 * 4); }
      }
      drawFx(u, fx.name);
    }
  }
  const skew = s1 * 3.5 * amp;
  bodyEl.style.transform = `translateY(${(-hop).toFixed(1)}px) skewX(${skew.toFixed(2)}deg)`;
  const neck = -Math.tan(skew * Math.PI / 180) * 50;
  head.style.transform = `translate(${(neck + s2 * 5 * amp + rx).toFixed(2)}px, ${(slump * 5 - hop).toFixed(1)}px) rotate(${(s2 * 5 * amp + rrot - slump * 4).toFixed(2)}deg)`;
  // se detiene del todo cuando no hay nada que animar (ahorra CPU)
  if (kind === 'animal' && (playing || amp > 0.01 || Math.abs(slump - (playing ? 0 : 1)) > 0.01 || fx)) raf = requestAnimationFrame(frame);
}

/* ---------- Moods: personas, pixel art a ~12 fps solo mientras suena ---------- */
let mood = null, moodTimer = 0, moodT = 0;
function drawMoodFrame() {
  if (!mood || !window.SCENES) return;
  const c = document.getElementById('scene').getContext('2d');
  c.clearRect(0, 0, 48, 48);
  SCENES[mood.mood](c, moodT, mood.action, !playing);
}
function moodStart() {
  moodStop(); let prev = performance.now();
  moodTimer = setInterval(() => {
    const now = performance.now(); if (!playing) { prev = now; return; }
    moodT += (now - prev) / 1000; prev = now;
    moodTick(mood, moodT); drawMoodFrame();
  }, 83);
  setTimeout(drawMoodFrame, 50);
}
function moodStop() { if (moodTimer) clearInterval(moodTimer); moodTimer = 0; }

/* ---------- Interacción ---------- */
const stage = document.getElementById('stage');
let down = null;
document.body.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || e.target.closest('.btn') || e.target.closest('#bar') || e.target.closest('#volrow')) return;
  down = { x: e.screenX, y: e.screenY, onStage: !!e.target.closest('#stage'), moved: false };
});
document.body.addEventListener('mousemove', (e) => {
  if (down && !down.moved && Math.hypot(e.screenX - down.x, e.screenY - down.y) > 4) {
    down.moved = true; inv('plugin:window|start_dragging').catch(() => {});
  }
});
document.body.addEventListener('mouseup', () => {
  if (down && down.onStage && !down.moved) inv('control', { action: 'playpause' });
  down = null;
});
document.getElementById('pp').onclick = () => inv('control', { action: 'playpause' });
const vbar = document.getElementById('vbar');
const setVol = (e) => {
  const r = vbar.getBoundingClientRect();
  const v = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  document.getElementById('vfill').style.width = Math.round(v * 100) + '%';
  inv('control', { action: 'volume', value: v });
};
vbar.addEventListener('mousedown', (e) => { draggingVol = true; setVol(e); e.stopPropagation(); });
window.addEventListener('mousemove', (e) => { if (draggingVol) setVol(e); });
window.addEventListener('mouseup', () => { draggingVol = false; });
document.getElementById('prev').onclick = () => { trigger('prev'); inv('control', { action: 'prev' }); };
document.getElementById('next').onclick = () => { trigger('next'); inv('control', { action: 'next' }); };
document.getElementById('bar').onclick = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  inv('control', { action: 'seek', value: (e.clientX - r.left) / r.width });
};

// Rueda del ratón: achicar / agrandar el flotante
document.body.addEventListener('wheel', (e) => {
  e.preventDefault();
  inv('scale_float', { delta: e.deltaY < 0 ? 0.1 : -0.1 });
}, { passive: false });

drawGlyph(document.querySelector('#prev canvas'), skipShape(-1));
drawGlyph(document.querySelector('#next canvas'), skipShape(1));
drawGlyph(document.getElementById('vicon'), speakerShape);
if (window.__TAURI_INTERNALS__) { poll(); setInterval(poll, 500); }
kick();
window.__render = render; // para pruebas
</script>
