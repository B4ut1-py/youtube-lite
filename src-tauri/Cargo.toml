[package]
name = "lite-music"
version = "0.1.0"
description = "Reproductor ligero de YouTube Music"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] } # unstable: dos páginas en la ventana principal (barra + música)
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com"] }
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
